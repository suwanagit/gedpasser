# The journey: a guided path through all 62 principles, easy first.
#
# Each stage teaches its principles with short cards, then a short quiz of
# `size` questions, preferring difficulty ≤ max_difficulty. Pass (about two
# thirds right) to unlock the next stage. A checkpoint mixes every principle
# since the previous checkpoint (or everything so far if cumulative).
# Early stages are small and easy on purpose: quick wins first.

# ── Part 1: everyday numbers ─────────────────────────────────────────────

