# The week path: seven days to test-ready.
#
# Two short sets a day (about 15 minutes), easiest first. Day 1 uses only the
# easiest questions, days 2-4 go up to medium, days 5-7 reach the hardest.
# The path covers the high- and medium-yield principles in strategy.toml; the
# rest stay in Practice and the practice tests.
#
# Each set is `size` questions from its principles, preferring difficulty
# <= max_difficulty. Pass (about two thirds right) to unlock the next set.
# A checkpoint mixes every principle since the previous checkpoint (or all
# of them if cumulative). Question cards are not shown before a set: the
# app tests first and explains only when asked.

# ── Day 1: warm-up ───────────────────────────────────────────────────────

[[stage]]
id = "d1a"
day = 1
title = "Shapes and averages"
principles = ["Q.4.a", "Q.7.a", "A.1.b"]
size = 5
max_difficulty = 1

[[stage]]
id = "d1b"
day = 1
title = "Chances, roots and rates"
principles = ["Q.8.b", "Q.2.b", "Q.1.a", "Q.3.a"]
size = 5
max_difficulty = 1

