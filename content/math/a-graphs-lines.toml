y_label = "km"

[[question]]
id = "a-graphs-lines-0007"
skill = "a-graphs-lines"
principle = "A.5.c"
difficulty = 2
type = "fill_in"
status = "reviewed"
alaska = true
prompt = '''
The cost of salmon is proportional to its weight: 3 kg costs \$54.
On a graph of cost (dollars) against weight (kg), what is the slope of the line?
'''
answer = "18"
check = "54 / 3"
explanation = 'The line passes through $(0, 0)$ and $(3, 54)$. Slope $= \frac{54}{3} = 18$, which is \$18 per kilogram.'
common_mistake = "Dividing weight by cost (3 ÷ 54) instead of cost by weight."

