# Slope and equations of lines (A.5.a-d, A.6.a-c)
# Text conventions: math goes in $...$ (KaTeX); a literal dollar sign is \$.
# Expression answers: `check` and `answer_value` both evaluate at a test value.

[[question]]
id = "a-graphs-lines-0001"
skill = "a-graphs-lines"
principle = "A.5.b"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
prompt = 'What is the slope of the line through $(1, 2)$ and $(4, 11)$?'
choices = ["3", "1/3", "9", "-3"]
answer = "3"
check = "(11 - 2) / (4 - 1)"
explanation = '''
Slope is rise over run: $m = \frac{y_2 - y_1}{x_2 - x_1} = \frac{11 - 2}{4 - 1} = \frac{9}{3} = 3$.
'''
common_mistake = "Putting the x change on top (run over rise), which gives 1/3."

[question.figure]
kind = "plane"
x_min = -1
x_max = 6
y_min = -2
y_max = 13
curves = ["3*x - 1"]
points = [{ x = 1, y = 2, label = "(1, 2)" }, { x = 4, y = 11, label = "(4, 11)" }]

[[question]]
id = "a-graphs-lines-0002"
skill = "a-graphs-lines"
principle = "A.5.d"
difficulty = 2
type = "fill_in"
status = "reviewed"
prompt = 'At what value of $x$ does the line $y = -2x + 7$ cross the $x$-axis?'
answer = "3.5"
check = "7 / 2"
explanation = '''
The line crosses the $x$-axis where $y = 0$: $0 = -2x + 7$.
So $2x = 7$ and $x = 3.5$.
'''
common_mistake = "Giving the y-intercept (7) instead of the x-intercept."

[[question]]
id = "a-graphs-lines-0003"
skill = "a-graphs-lines"
principle = "A.6.c"
difficulty = 3
type = "multiple_choice"
status = "reviewed"
prompt = 'Which line is perpendicular to $y = \frac{2}{3}x - 1$ and passes through $(0, 4)$?'
choices = ['$y = -\frac{3}{2}x + 4$', '$y = \frac{3}{2}x + 4$', '$y = -\frac{2}{3}x + 4$', '$y = \frac{2}{3}x + 4$']
answer = '$y = -\frac{3}{2}x + 4$'
answer_value = 1.0             # the answer line at x = 2
check = "-1 / (2/3) * 2 + 4"   # perpendicular slope through (0, 4), at x = 2
explanation = '''
Perpendicular slopes are negative reciprocals. The reciprocal of $\frac{2}{3}$ is $\frac{3}{2}$, so the new slope is $-\frac{3}{2}$.
The line passes through $(0, 4)$, so the $y$-intercept is 4: $y = -\frac{3}{2}x + 4$.
'''
common_mistake = "Changing only the sign (−2/3) or only flipping the fraction (3/2)."

[[question]]
id = "a-graphs-lines-0004"
skill = "a-graphs-lines"
principle = "A.5.a"
difficulty = 1
type = "fill_in"
status = "reviewed"
prompt = 'Point $A$ is at $(-4, 3)$. Point $B$ is 6 units to the right of $A$. What is the $x$-coordinate of $B$?'
answer = "2"
check = "-4 + 6"
explanation = 'Moving right adds to the $x$-coordinate: $-4 + 6 = 2$. Point $B$ is at $(2, 3)$.'
common_mistake = "Moving left instead of right (−4 − 6 = −10)."

[[question]]
id = "a-graphs-lines-0005"
skill = "a-graphs-lines"
principle = "A.5.a"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = 'The points $(2, -3)$ and $(2, 5)$ lie on a vertical line. How many units apart are they?'
choices = ["8", "2", "4", "10"]
answer = "8"
check = "5 - (-3)"
explanation = 'They have the same $x$-coordinate, so the distance is the difference in $y$: $5 - (-3) = 8$ units.'
common_mistake = "Subtracting 3 from 5 (2) and ignoring that −3 is below zero."

[[question]]
id = "a-graphs-lines-0006"
skill = "a-graphs-lines"
principle = "A.5.c"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = '''
A proportional relationship between liters of fuel ($x$) and kilometers driven ($y$) is graphed as a line through $(0, 0)$ and $(5, 40)$.
How many kilometers can be driven per liter?
'''
choices = ["8", "40", "0.125", "35"]
answer = "8"
check = "40 / 5"
explanation = 'The unit rate is the slope: $\frac{40 - 0}{5 - 0} = 8$ km per liter.'
common_mistake = "Dividing x by y (5 ÷ 40 = 0.125), which gives liters per kilometer."

