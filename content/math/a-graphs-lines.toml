[[question]]
id = "a-graphs-lines-0008"
skill = "a-graphs-lines"
principle = "A.6.a"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = 'Which is the equation of the line with slope $-2$ that passes through $(1, 4)$?'
choices = ['$y = -2x + 6$', '$y = -2x + 4$', '$y = -2x + 2$', '$y = 2x + 2$']
answer = '$y = -2x + 6$'
answer_value = 6.0               # y-intercept of the answer
check = "4 - (-2) * 1"           # b = y1 - m*x1
explanation = '''
Use point-slope form: $y - 4 = -2(x - 1)$, so $y - 4 = -2x + 2$ and $y = -2x + 6$.
Check: at $x = 1$, $y = -2 + 6 = 4$. ✓
'''
common_mistake = "Using the point's y-value (4) as the y-intercept, which only works when x = 0."

[[question]]
id = "a-graphs-lines-0009"
skill = "a-graphs-lines"
principle = "A.6.a"
difficulty = 3
type = "fill_in"
status = "reviewed"
prompt = 'A line has slope $\frac{1}{2}$ and passes through $(4, 7)$. What is its $y$-intercept?'
answer = "5"
check = "7 - 1 / 2 * 4"
explanation = '''
In $y = mx + b$, put in the point and slope: $7 = \frac{1}{2}(4) + b = 2 + b$, so $b = 5$.
'''
common_mistake = "Adding instead of subtracting (7 + 2 = 9)."

[[question]]
id = "a-graphs-lines-0010"
skill = "a-graphs-lines"
principle = "A.6.b"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = 'Which is the equation of the line through $(0, -1)$ and $(2, 5)$?'
choices = ['$y = 3x - 1$', '$y = 2x - 1$', '$y = 3x + 5$', '$y = -3x - 1$']
answer = '$y = 3x - 1$'
answer_value = 5.0                            # the answer line at x = 2
check = "(5 - (-1)) / (2 - 0) * 2 + (-1)"     # slope from the points, through (0, -1), at x = 2
explanation = '''
Slope: $\frac{5 - (-1)}{2 - 0} = \frac{6}{2} = 3$. The point $(0, -1)$ gives the $y$-intercept $-1$.
So $y = 3x - 1$. Check: at $x = 2$, $y = 6 - 1 = 5$. ✓
'''
common_mistake = "Using the second point's x-value (2) as the slope, which gives y = 2x − 1."

[[question]]
id = "a-graphs-lines-0011"
skill = "a-graphs-lines"
principle = "A.6.b"
difficulty = 3
type = "fill_in"
status = "reviewed"
prompt = 'A line passes through $(1, 2)$ and $(3, -4)$. What is its $y$-intercept?'
answer = "5"
check = "2 - (-4 - 2) / (3 - 1) * 1"
explanation = '''
Slope: $\frac{-4 - 2}{3 - 1} = \frac{-6}{2} = -3$.
Use $(1, 2)$: $2 = -3(1) + b$, so $b = 5$. The line is $y = -3x + 5$.
'''
common_mistake = "Getting the slope's sign wrong (+3), which gives a y-intercept of −1."

[[question]]
id = "a-graphs-lines-0012"
skill = "a-graphs-lines"
principle = "A.5.b"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = '''
A line passes through the points in this table: when $x = 0$, $y = 1$; when $x = 2$, $y = 7$; when $x = 4$, $y = 13$.
What is the slope of the line?
'''
choices = ["3", "6", "2", "12"]
answer = "3"
check = "(13 - 1) / (4 - 0)"
explanation = '''
Each time $x$ goes up by 2, $y$ goes up by 6. Slope $= \frac{6}{2} = 3$.
(Using the first and last rows: $\frac{13 - 1}{4 - 0} = 3$.)
'''
common_mistake = "Using only the change in y (6) and forgetting to divide by the change in x."
