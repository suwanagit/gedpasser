[[question]]
id = "q-ratios-percent-0010"
skill = "q-ratios-percent"
principle = "Q.3.c"
difficulty = 3
type = "fill_in"
status = "draft"
prompt = '''
A two-stroke engine needs oil and gas mixed in a ratio of 1 : 50.
How many milliliters of oil should be mixed with 4 liters of gas?
'''
answer = "80"
check = "4 * 1000 / 50"
explanation = '''
Change liters to milliliters: $4 \text{ L} = 4000$ mL.
The oil is $\frac{1}{50}$ of the gas: $4000 \div 50 = 80$ mL.
'''
common_mistake = "Dividing 4 by 50 without converting to milliliters (0.08)."

[[question]]
id = "q-ratios-percent-0011"
skill = "q-ratios-percent"
principle = "Q.3.d"
difficulty = 2
type = "multiple_choice"
status = "draft"
prompt = "A town's population grew from 2,400 to 2,700. What was the percent increase?"
choices = ["12.5%", "11.1%", "300%", "25%"]
answer = "12.5%"
check = "(2700 - 2400) / 2400 * 100"
explanation = '''
Change: $2700 - 2400 = 300$.
Percent increase $= \frac{300}{2400} \times 100\% = 12.5\%$.
'''
common_mistake = "Dividing by the new population (300 ÷ 2700 ≈ 11.1%) instead of the original."

