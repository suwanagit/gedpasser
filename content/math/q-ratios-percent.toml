[[question]]
id = "q-ratios-percent-0006"
skill = "q-ratios-percent"
principle = "Q.3.b"
difficulty = 2
type = "fill_in"
status = "draft"
prompt = '''
A model boat is built at a scale of 1 : 24. The model is 45 cm long.
How long is the real boat, in meters?
'''
answer = "10.8"
check = "45 * 24 / 100"
explanation = '''
Each centimeter on the model stands for 24 cm on the real boat: $45 \times 24 = 1080$ cm.
Change to meters: $1080 \div 100 = 10.8$ m.
'''
common_mistake = "Forgetting to change centimeters to meters and answering 1080."

[[question]]
id = "q-ratios-percent-0007"
skill = "q-ratios-percent"
principle = "Q.3.b"
difficulty = 3
type = "multiple_choice"
status = "draft"
prompt = '''
A rectangle with an area of 8 cm² is enlarged by a scale factor of 3.
What is the area of the enlarged rectangle, in cm²?
'''
choices = ["72", "24", "11", "216"]
answer = "72"
check = "8 * 3^2"
explanation = '''
Each length is multiplied by 3, so the area is multiplied by $3 \times 3 = 9$.
New area: $8 \times 9 = 72$ cm².
'''
common_mistake = "Multiplying the area by 3 (giving 24) instead of by 3² = 9."

[[question]]
id = "q-ratios-percent-0008"
skill = "q-ratios-percent"
principle = "Q.3.c"
difficulty = 2
type = "fill_in"
status = "draft"
prompt = '''
A recipe uses 250 g of flour to make 12 pieces of bannock.
How many grams of flour are needed for 30 pieces?
'''
answer = "625"
check = "250 / 12 * 30"
explanation = '''
Set up a proportion: $\frac{250}{12} = \frac{x}{30}$.
Cross-multiply: $12x = 250 \times 30 = 7500$, so $x = 625$ g.
'''
common_mistake = "Adding the 18 extra pieces to 250 (giving 268) instead of scaling the whole amount."

