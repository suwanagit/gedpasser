# Counting and probability (Q.8.a/b)
# Text conventions: math goes in $...$ (KaTeX); a literal dollar sign is \$.

[[question]]
id = "q-probability-0001"
skill = "q-probability"
principle = "Q.8.b"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
prompt = '''
A bag holds 3 red beads, 5 blue beads and 2 green beads.
One bead is drawn at random. What is the probability that it is blue?
'''
choices = ['$\frac{1}{2}$', '$\frac{1}{5}$', '$\frac{5}{3}$', '$\frac{3}{10}$']
answer = '$\frac{1}{2}$'
check = "5 / (3 + 5 + 2)"
explanation = '''
There are $3 + 5 + 2 = 10$ beads, and 5 of them are blue.
Probability $= \frac{5}{10} = \frac{1}{2}$.
'''
common_mistake = "Comparing blue to red (5/3) instead of blue to all the beads."

[[question]]
id = "q-probability-0002"
skill = "q-probability"
principle = "Q.8.a"
difficulty = 2
type = "fill_in"
status = "reviewed"
alaska = true
prompt = '''
A café in Sitka offers 4 kinds of soup and 3 kinds of bread.
A lunch special is one soup and one bread. How many different lunch specials are possible?
'''
answer = "12"
check = "4 * 3"
explanation = 'Each of the 4 soups can go with each of the 3 breads, so there are $4 \times 3 = 12$ choices.'
common_mistake = "Adding the choices (4 + 3 = 7) instead of multiplying."

[[question]]
id = "q-probability-0003"
skill = "q-probability"
principle = "Q.8.b"
difficulty = 3
type = "multiple_choice"
status = "reviewed"
prompt = '''
A coin is flipped and a six-sided number cube is rolled.
What is the probability of getting heads and a number greater than 4?
'''
choices = ['$\frac{1}{6}$', '$\frac{1}{3}$', '$\frac{5}{6}$', '$\frac{2}{3}$']
answer = '$\frac{1}{6}$'
check = "1/2 * 2/6"
explanation = '''
Heads: $\frac{1}{2}$. A number greater than 4 (5 or 6): $\frac{2}{6} = \frac{1}{3}$.
The events are independent, so multiply: $\frac{1}{2} \times \frac{1}{3} = \frac{1}{6}$.
'''
common_mistake = "Adding the two probabilities instead of multiplying them."

[[question]]
id = "q-probability-0004"
skill = "q-probability"
principle = "Q.8.a"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = "In how many different orders can 4 people stand in a line for a photo?"
choices = ["24", "16", "4", "10"]
answer = "24"
check = "fact(4)"
explanation = '''
There are 4 choices for the first spot, then 3, then 2, then 1.
$4 \times 3 \times 2 \times 1 = 24$ orders.
'''
common_mistake = "Multiplying 4 × 4 = 16, as if the same person could stand in two places."

[[question]]
id = "q-probability-0005"
skill = "q-probability"
principle = "Q.8.a"
difficulty = 3
type = "fill_in"
status = "reviewed"
prompt = "A committee of 3 people is chosen from 7 volunteers. How many different committees are possible?"
answer = "35"
check = "comb(7, 3)"
explanation = '''
Order does not matter on a committee, so this is a combination.
Ordered choices: $7 \times 6 \times 5 = 210$. Each committee of 3 can be ordered $3 \times 2 \times 1 = 6$ ways.
So there are $210 \div 6 = 35$ committees.
'''
common_mistake = "Counting ordered choices (210) when the order of committee members does not matter."

[[question]]
id = "q-probability-0006"
skill = "q-probability"
principle = "Q.8.a"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = "A locker code has 3 digits. Each digit can be 0 through 9, and digits may repeat. How many codes are possible?"
choices = ["1000", "30", "720", "27"]
answer = "1000"
check = "10^3"
explanation = 'Each of the 3 digits has 10 choices: $10 \times 10 \times 10 = 1000$ codes.'
common_mistake = "Not allowing repeats (10 × 9 × 8 = 720) even though digits may repeat."

[[question]]
id = "q-probability-0007"
skill = "q-probability"
principle = "Q.8.a"
difficulty = 3
type = "fill_in"
status = "reviewed"
prompt = "Eight runners are in a race. In how many ways can the gold, silver and bronze medals be awarded?"
answer = "336"
check = "perm(8, 3)"
explanation = '''
Order matters: gold, then silver, then bronze.
$8 \times 7 \times 6 = 336$ ways.
'''
common_mistake = "Treating it as a combination (56), but gold, silver and bronze are different prizes."

[[question]]
id = "q-probability-0008"
skill = "q-probability"
principle = "Q.8.b"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
prompt = "A spinner has 8 equal sections numbered 1 to 8. What is the probability of spinning a number greater than 5?"
choices = ['$\frac{3}{8}$', '$\frac{5}{8}$', '$\frac{1}{2}$', '$\frac{3}{5}$']
answer = '$\frac{3}{8}$'
check = "3 / 8"
explanation = '''
The numbers greater than 5 are 6, 7 and 8: 3 favorable outcomes out of 8.
Probability $= \frac{3}{8}$.
'''
common_mistake = "Including 5 itself (4/8 = 1/2), or counting the numbers that are not greater than 5 (5/8)."

[[question]]
id = "q-probability-0009"
skill = "q-probability"
principle = "Q.8.b"
difficulty = 1
type = "fill_in"
status = "draft"
prompt = "The probability of rain tomorrow is 0.35. What is the probability that it does not rain? Give a decimal."
answer = "0.65"
check = "1 - 0.35"
explanation = '''An event either happens or it doesn't, so the two probabilities add to 1: $1 - 0.35 = 0.65$.'''
common_mistake = "Giving the chance that it does rain (0.35), or writing the percent 65 when a decimal is asked for."

[[question]]
id = "q-probability-0010"
skill = "q-probability"
principle = "Q.8.b"
difficulty = 3
type = "multiple_choice"
status = "reviewed"
prompt = '''
A bag has 4 red marbles and 6 blue marbles. Two marbles are drawn without putting the first one back.
What is the probability that both are red?
'''
choices = ['$\frac{2}{15}$', '$\frac{4}{25}$', '$\frac{2}{5}$', '$\frac{1}{5}$']
answer = '$\frac{2}{15}$'
check = "4 / 10 * 3 / 9"
explanation = '''
First marble red: $\frac{4}{10}$. Then 3 red are left out of 9: $\frac{3}{9}$.
Both: $\frac{4}{10} \times \frac{3}{9} = \frac{12}{90} = \frac{2}{15}$.
'''
common_mistake = "Using 4/10 for both draws (16/100 = 4/25), as if the first marble went back in the bag."

[[question]]
id = "q-probability-0011"
skill = "q-probability"
principle = "Q.8.b"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = "A six-sided number cube is rolled twice. What is the probability of rolling a 6 both times?"
choices = ['$\frac{1}{36}$', '$\frac{1}{6}$', '$\frac{1}{3}$', '$\frac{1}{12}$']
answer = '$\frac{1}{36}$'
check = "1 / 6 * 1 / 6"
explanation = 'The rolls are independent, so multiply: $\frac{1}{6} \times \frac{1}{6} = \frac{1}{36}$.'
common_mistake = "Adding the probabilities (1/6 + 1/6 = 1/3) instead of multiplying."

[[question]]
id = "q-probability-0012"
skill = "q-probability"
principle = "Q.8.b"
difficulty = 3
type = "fill_in"
status = "reviewed"
alaska = true
prompt = '''
At a fishing derby, Lee buys 6 of the 120 tickets in the first-prize drawing and 2 of the 40 tickets in a separate second drawing.
What is the probability that Lee wins both drawings? Give your answer as a fraction.
'''
answer = "1/400"
check = "6 / 120 * 2 / 40"
explanation = '''
First drawing: $\frac{6}{120} = \frac{1}{20}$. Second drawing: $\frac{2}{40} = \frac{1}{20}$.
The drawings are independent, so multiply: $\frac{1}{20} \times \frac{1}{20} = \frac{1}{400}$.
'''
common_mistake = "Adding the two probabilities (1/20 + 1/20 = 1/10) instead of multiplying."
