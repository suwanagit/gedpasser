principle = "Q.4.c"
difficulty = 1
type = "fill_in"
status = "draft"
prompt = "A garden bed is shaped like a regular pentagon with sides of 2.4 m. What is its perimeter, in meters?"
answer = "12"
check = "5 * 2.4"
explanation = 'A regular pentagon has 5 equal sides: $5 \times 2.4 = 12$ m.'
