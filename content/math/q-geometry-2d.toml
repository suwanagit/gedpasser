# Perimeter, area and the Pythagorean theorem (Q.4.a-e)
# Text conventions: math goes in $...$ (KaTeX); a literal dollar sign is \$.

[[question]]
id = "q-geometry-2d-0001"
skill = "q-geometry-2d"
principle = "Q.4.a"
difficulty = 1
type = "fill_in"
status = "draft"
prompt = "A rectangular garden is 8 m long and 5 m wide. What is its perimeter in meters?"
answer = "26"
check = "2 * (8 + 5)"
explanation = '''
Perimeter is the distance around: $8 + 5 + 8 + 5 = 26$ m,
or $2 \times (8 + 5) = 26$ m.
'''
common_mistake = "Finding the area (8 × 5 = 40) instead of the perimeter."

[[question]]
id = "q-geometry-2d-0002"
skill = "q-geometry-2d"
principle = "Q.4.b"
difficulty = 2
type = "multiple_choice"
status = "draft"
prompt = '''
A round hatch on a boat deck has a radius of 0.6 m.
What is its area, to the nearest hundredth of a square meter? Use $\pi \approx 3.14$.
'''
choices = ["1.13", "3.77", "0.36", "1.88"]
answer = "1.13"
check = "round(3.14 * 0.6^2, 2)"
explanation = '''
Area of a circle: $A = \pi r^2$.
$A \approx 3.14 \times 0.6^2 = 3.14 \times 0.36 = 1.1304$, which rounds to 1.13 m².
'''
common_mistake = "Using the circumference formula 2πr, which gives 3.77."

[[question]]
id = "q-geometry-2d-0003"
skill = "q-geometry-2d"
principle = "Q.4.e"
difficulty = 2
type = "multiple_choice"
status = "draft"
alaska = true
prompt = '''
At a Seward harbor, the ramp down to a floating dock rises 1.2 m over a horizontal distance of 3.5 m.
How long is the ramp, in meters?
'''
choices = ["3.7", "4.7", "3.5", "13.69"]
answer = "3.7"
check = "sqrt(1.2^2 + 3.5^2)"
explanation = '''
The ramp is the hypotenuse of a right triangle, so use $a^2 + b^2 = c^2$:
$1.2^2 + 3.5^2 = 1.44 + 12.25 = 13.69$, and $c = \sqrt{13.69} = 3.7$ m.
'''
common_mistake = "Adding the two sides (1.2 + 3.5 = 4.7) instead of using the Pythagorean theorem."

[[question]]
id = "q-geometry-2d-0004"
skill = "q-geometry-2d"
principle = "Q.4.a"
difficulty = 1
type = "fill_in"
status = "draft"
prompt = "A triangular sail has a base of 3 m and a height of 5 m. What is its area, in square meters?"
answer = "7.5"
check = "3 * 5 / 2"
explanation = 'Area of a triangle: $A = \frac{1}{2}bh = \frac{1}{2} \times 3 \times 5 = 7.5$ m².'
common_mistake = "Forgetting the ½ and answering 15."

[[question]]
id = "q-geometry-2d-0005"
skill = "q-geometry-2d"
principle = "Q.4.a"
difficulty = 2
type = "multiple_choice"
status = "draft"
prompt = '''
A rectangular plot has an area of 54 square meters and a width of 6 meters.
What is its perimeter, in meters?
'''
choices = ["30", "15", "24", "60"]
answer = "30"
check = "2 * (54 / 6 + 6)"
explanation = '''
First find the length: $54 \div 6 = 9$ m.
Then the perimeter: $2 \times (9 + 6) = 2 \times 15 = 30$ m.
'''
common_mistake = "Adding the length and width once (9 + 6 = 15) instead of going all the way around."

[[question]]
id = "q-geometry-2d-0006"
skill = "q-geometry-2d"
principle = "Q.4.b"
difficulty = 2
type = "fill_in"
status = "draft"
prompt = '''
A round fire pit has a diameter of 1.2 m.
What is its circumference, to the nearest hundredth of a meter? Use $\pi \approx 3.14$.
'''
answer = "3.77"
check = "round(3.14 * 1.2, 2)"
explanation = '''
Circumference: $C = \pi d \approx 3.14 \times 1.2 = 3.768$ m.
Rounded to the nearest hundredth: 3.77 m.
'''
common_mistake = "Using 2πd (doubling the diameter), which gives 7.54."

[[question]]
id = "q-geometry-2d-0007"
skill = "q-geometry-2d"
principle = "Q.4.b"
difficulty = 3
type = "multiple_choice"
status = "draft"
prompt = 'A circle has a circumference of 62.8 cm. Using $\pi \approx 3.14$, what is its area, in square centimeters?'
choices = ["314", "62.8", "1256", "100"]
answer = "314"
check = "3.14 * (62.8 / (2 * 3.14))^2"
explanation = '''
Find the radius from $C = 2\pi r$: $r = 62.8 \div (2 \times 3.14) = 62.8 \div 6.28 = 10$ cm.
Area: $A = \pi r^2 \approx 3.14 \times 10^2 = 314$ cm².
'''
common_mistake = "Using the diameter (20 cm) in πr², which gives 1256."

[[question]]
id = "q-geometry-2d-0008"
skill = "q-geometry-2d"
principle = "Q.4.c"
difficulty = 2
type = "multiple_choice"
status = "draft"
prompt = '''
A trapezoid has parallel sides of 6 m and 10 m and a height of 5 m.
Using $A = \frac{1}{2}(b_1 + b_2)h$, what is its area, in square meters?
'''
choices = ["40", "80", "300", "21"]
answer = "40"
check = "(6 + 10) / 2 * 5"
explanation = 'Put the numbers into the formula: $A = \frac{1}{2}(6 + 10) \times 5 = \frac{1}{2} \times 16 \times 5 = 40$ m².'
common_mistake = "Forgetting the ½ and answering 80."

[[question]]
id = "q-geometry-2d-0009"
