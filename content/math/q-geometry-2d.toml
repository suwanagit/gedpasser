[[question]]
id = "q-geometry-2d-0010"
skill = "q-geometry-2d"
principle = "Q.4.d"
difficulty = 2
type = "multiple_choice"
status = "draft"
prompt = '''
An L-shaped floor is made of two rectangles that do not overlap: one is 6 m by 4 m and the other is 3 m by 2 m.
What is the total floor area, in square meters?
'''
choices = ["30", "24", "15", "36"]
answer = "30"
check = "6 * 4 + 3 * 2"
explanation = '''
Find each area and add: $6 \times 4 = 24$ m² and $3 \times 2 = 6$ m².
Total: $24 + 6 = 30$ m².
'''
common_mistake = "Adding all the side lengths (6 + 4 + 3 + 2 = 15) instead of finding areas."

[[question]]
id = "q-geometry-2d-0011"
skill = "q-geometry-2d"
principle = "Q.4.d"
difficulty = 3
type = "fill_in"
status = "draft"
prompt = '''
A square yard is 10 m on each side. It has a round pond with a radius of 2 m.
How many square meters of the yard are not covered by the pond? Use $\pi \approx 3.14$.
'''
answer = "87.44"
check = "10^2 - 3.14 * 2^2"
explanation = '''
Yard: $10 \times 10 = 100$ m². Pond: $\pi r^2 \approx 3.14 \times 2^2 = 12.56$ m².
Not covered: $100 - 12.56 = 87.44$ m².
'''
common_mistake = "Using the diameter (4 m) as the radius, which makes the pond 50.24 m²."

[[question]]
id = "q-geometry-2d-0012"
skill = "q-geometry-2d"
principle = "Q.4.e"
difficulty = 2
type = "multiple_choice"
status = "draft"
alaska = true
prompt = '''
A 5-meter ladder leans against the wall of a cabin. The foot of the ladder is 3 m from the wall.
How high up the wall does the ladder reach, in meters?
'''
choices = ["4", "5.83", "2", "8"]
answer = "4"
check = "sqrt(5^2 - 3^2)"
explanation = '''
The ladder is the hypotenuse: $3^2 + h^2 = 5^2$.
So $h^2 = 25 - 9 = 16$ and $h = 4$ m.
'''
common_mistake = "Adding the squares (√34 ≈ 5.83) as if the ladder were a leg instead of the hypotenuse."
