# Polynomials, rational expressions and quadratics (A.1.d-j, A.4.a/b)
# Text conventions: math goes in $...$ (KaTeX); a literal dollar sign is \$.
# Expression answers: `check` and `answer_value` both evaluate at a test value.

[[question]]
id = "a-polynomials-0001"
skill = "a-polynomials"
principle = "A.1.d"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
prompt = 'Multiply: $(x + 3)(x + 5)$.'
choices = ['$x^2 + 8x + 15$', '$x^2 + 15$', '$x^2 + 8x + 8$', '$2x + 8$']
answer = '$x^2 + 8x + 15$'
answer_value = 35.0            # x^2 + 8x + 15 at x = 2
check = "(2 + 3) * (2 + 5)"    # original product at x = 2
explanation = '''
Multiply each term in the first binomial by each term in the second:
$x \cdot x + x \cdot 5 + 3 \cdot x + 3 \cdot 5 = x^2 + 5x + 3x + 15 = x^2 + 8x + 15$.
'''
common_mistake = "Multiplying only the first terms and the last terms, which gives x² + 15."

[[question]]
id = "a-polynomials-0002"
skill = "a-polynomials"
principle = "A.4.a"
difficulty = 2
type = "fill_in"
status = "reviewed"
prompt = 'What is the positive solution of $x^2 - 5x - 14 = 0$?'
answer = "7"
check = "(5 + sqrt(5^2 + 4 * 14)) / 2"
explanation = '''
Factor: find two numbers that multiply to $-14$ and add to $-5$. They are $-7$ and $2$.
So $(x - 7)(x + 2) = 0$, which gives $x = 7$ or $x = -2$. The positive solution is 7.
'''
common_mistake = "Getting the signs backwards and answering 2 from (x + 7)(x − 2)."

[[question]]
id = "a-polynomials-0003"
skill = "a-polynomials"
principle = "A.1.f"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = 'Factor completely: $x^2 - 49$.'
choices = ['$(x - 7)(x + 7)$', '$(x - 7)^2$', '$(x - 49)(x + 1)$', '$(x + 7)^2$']
answer = '$(x - 7)(x + 7)$'
answer_value = 51.0            # (x - 7)(x + 7) at x = 10
check = "10^2 - 49"            # original expression at x = 10
explanation = '''
$x^2 - 49$ is a difference of two squares: $x^2 - 7^2$.
A difference of squares factors as $a^2 - b^2 = (a - b)(a + b)$, so $x^2 - 49 = (x - 7)(x + 7)$.
'''
common_mistake = "Writing (x − 7)², which expands to x² − 14x + 49, not x² − 49."

[[question]]
id = "a-polynomials-0004"
skill = "a-polynomials"
principle = "A.1.e"
difficulty = 1
type = "fill_in"
status = "reviewed"
prompt = 'Evaluate $2x^2 - 3x + 1$ when $x = 4$.'
answer = "21"
check = "2 * 4^2 - 3 * 4 + 1"
explanation = '''
Square first: $4^2 = 16$. Then $2(16) - 3(4) + 1 = 32 - 12 + 1 = 21$.
'''
common_mistake = "Squaring 2x as a whole, (2 × 4)² = 64, instead of squaring only x."

[[question]]
id = "a-polynomials-0005"
skill = "a-polynomials"
principle = "A.1.g"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = '''
A garden is a square with sides of $s$ meters. It is made 1 meter longer in one direction, so it becomes a rectangle $s$ meters by $s + 1$ meters.
Which expression gives the new area, in square meters?
'''
choices = ['$s^2 + s$', '$s^2 + 1$', '$2s + 1$', '$s^2 + 2s + 1$']
answer = '$s^2 + s$'
answer_value = 12.0              # s^2 + s at s = 3
check = "3 * (3 + 1)"            # area of a 3 by 4 rectangle
explanation = '''
Area $=$ length $\times$ width $= s(s + 1) = s^2 + s$.
'''
common_mistake = "Adding 1 to both sides, (s + 1)² = s² + 2s + 1, when only one side grew."

[question.figure]
kind = "shape"
polygons = [{ points = [{ x = 0, y = 0 }, { x = 6, y = 0 }, { x = 6, y = 5 }, { x = 0, y = 5 }], side_labels = ["s + 1", "s", "", ""], right_angles = [0] }]

[[question]]
id = "a-polynomials-0006"
skill = "a-polynomials"
principle = "A.1.h"
difficulty = 3
type = "multiple_choice"
status = "reviewed"
prompt = 'Simplify $\frac{x^2 - 16}{x + 4}$, where $x \ne -4$.'
choices = ['$x - 4$', '$x + 4$', '$x - 16$', '$x^2 - 4$']
answer = '$x - 4$'
answer_value = 2.0               # x - 4 at x = 6
check = "(6^2 - 16) / (6 + 4)"   # original expression at x = 6
explanation = '''
Factor the top as a difference of squares: $x^2 - 16 = (x - 4)(x + 4)$.
Cancel the common factor $(x + 4)$: $\frac{(x - 4)(x + 4)}{x + 4} = x - 4$.
'''
common_mistake = "Cancelling terms instead of factors, such as crossing out x and 4 to get x − 16 or x² − 4."

[[question]]
id = "a-polynomials-0007"
skill = "a-polynomials"
principle = "A.1.i"
difficulty = 2
type = "fill_in"
status = "reviewed"
prompt = 'Evaluate $\frac{x + 6}{x - 2}$ when $x = 4$.'
answer = "5"
check = "(4 + 6) / (4 - 2)"
explanation = 'Top: $4 + 6 = 10$. Bottom: $4 - 2 = 2$. Value: $10 \div 2 = 5$.'
common_mistake = "Dividing only part of the top by the bottom, such as 4 + 6 ÷ 2 = 7."

[[question]]
id = "a-polynomials-0008"
skill = "a-polynomials"
principle = "A.1.j"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = '''
A pump fills a 500-liter water tank in $t$ minutes.
Which expression gives the pump's rate, in liters per minute?
'''
choices = ['$\frac{500}{t}$', '$500t$', '$\frac{t}{500}$', '$500 - t$']
answer = '$\frac{500}{t}$'
answer_value = 20.0              # rate when t = 25
check = "500 / 25"
explanation = 'A rate in liters per minute is liters divided by minutes: $\frac{500}{t}$.'
common_mistake = "Putting the minutes on top (t/500), which gives minutes per liter."

[[question]]
id = "a-polynomials-0009"
skill = "a-polynomials"
principle = "A.4.b"
difficulty = 3
type = "multiple_choice"
status = "reviewed"
prompt = '''
A rectangular garden's length is 2 m less than twice its width, and its area is 60 square meters.
Which equation can be solved to find the width $w$, in meters?
'''
choices = ['$w(2w - 2) = 60$', '$w(w - 2) = 60$', '$2w - 2 = 60$', '$w(2w + 2) = 60$']
answer = '$w(2w - 2) = 60$'
answer_value = 6.0                      # positive solution of w(2w - 2) = 60
check = "(1 + sqrt(1 + 4 * 30)) / 2"     # w^2 - w - 30 = 0
explanation = '''
"Twice its width" is $2w$, and "2 m less than" that is $2w - 2$, so the length is $2w - 2$.
Area $=$ width $\times$ length: $w(2w - 2) = 60$.
(It simplifies to $w^2 - w - 30 = 0$, which factors as $(w - 6)(w + 5) = 0$, so the width is 6 m and the length is 10 m.)
'''
common_mistake = "Writing the length as w − 2 and leaving out \"twice\"."

[[question]]
id = "a-polynomials-0010"
skill = "a-polynomials"
principle = "A.1.d"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = 'Subtract: $(5x^2 + 3x - 2) - (2x^2 - x + 4)$.'
choices = ['$3x^2 + 4x - 6$', '$3x^2 + 2x + 2$', '$3x^2 + 4x + 2$', '$7x^2 + 2x + 2$']
answer = '$3x^2 + 4x - 6$'
answer_value = 14.0                                 # 3x^2 + 4x - 6 at x = 2
check = "(5 * 2^2 + 3 * 2 - 2) - (2 * 2^2 - 2 + 4)"  # original expression at x = 2
explanation = '''
Change the sign of every term in the second polynomial and add: $5x^2 + 3x - 2 - 2x^2 + x - 4$.
Combine like terms: $3x^2 + 4x - 6$.
'''
common_mistake = "Subtracting only the first term of the second polynomial, which gives 3x² + 2x + 2."

[[question]]
id = "a-polynomials-0011"
skill = "a-polynomials"
principle = "A.1.f"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = 'Factor $x^2 + 2x - 15$.'
choices = ['$(x + 5)(x - 3)$', '$(x - 5)(x + 3)$', '$(x + 15)(x - 1)$', '$(x + 5)(x + 3)$']
answer = '$(x + 5)(x - 3)$'
answer_value = 9.0                 # (x + 5)(x - 3) at x = 4
check = "4^2 + 2 * 4 - 15"         # original expression at x = 4
explanation = '''
Find two numbers that multiply to $-15$ and add to $+2$: they are $5$ and $-3$.
So $x^2 + 2x - 15 = (x + 5)(x - 3)$.
'''
common_mistake = "Getting the signs backwards, (x − 5)(x + 3), which multiplies out to x² − 2x − 15."

[[question]]
id = "a-polynomials-0012"
skill = "a-polynomials"
principle = "A.4.a"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = 'Which number is a solution of $3x^2 - 27 = 0$?'
choices = ["3", "9", "27", "81"]
answer = "3"
check = "sqrt(27 / 3)"
explanation = '''
Add 27 to both sides: $3x^2 = 27$. Divide by 3: $x^2 = 9$.
So $x = 3$ or $x = -3$. Of the choices, 3 is a solution.
'''
common_mistake = "Stopping at x² = 9 and answering 9 without taking the square root."
