# Exponents, roots and scientific notation (Q.1.c, Q.2.b/c)
# Text conventions: math goes in $...$ (KaTeX); a literal dollar sign is \$.

[[question]]
id = "q-exponents-roots-0001"
skill = "q-exponents-roots"
principle = "Q.2.c"
difficulty = 1
type = "multiple_choice"
status = "draft"
prompt = 'What is the value of $5^3$?'
choices = ["15", "125", "25", "243"]
answer = "125"
check = "5^3"
explanation = '$5^3$ means $5 \times 5 \times 5$. $5 \times 5 = 25$ and $25 \times 5 = 125$.'
common_mistake = "Multiplying the base by the exponent: 5 × 3 = 15."

[[question]]
id = "q-exponents-roots-0002"
skill = "q-exponents-roots"
principle = "Q.2.b"
difficulty = 2
type = "fill_in"
status = "draft"
prompt = 'What is $\sqrt{144} + \sqrt[3]{27}$?'
answer = "15"
check = "sqrt(144) + cbrt(27)"
explanation = '''
$\sqrt{144} = 12$ because $12 \times 12 = 144$.
$\sqrt[3]{27} = 3$ because $3 \times 3 \times 3 = 27$.
So the sum is $12 + 3 = 15$.
'''
common_mistake = "Treating the cube root like a square root and looking for a number that times itself makes 27."

[[question]]
id = "q-exponents-roots-0003"
skill = "q-exponents-roots"
principle = "Q.1.c"
difficulty = 2
type = "multiple_choice"
status = "draft"
prompt = '''
A water sample has $3 \times 10^{5}$ bacteria in each millilitre.
How many bacteria are in $4 \times 10^{2}$ millilitres of the water?
'''
choices = ['$1.2 \times 10^{8}$', '$7 \times 10^{7}$', '$1.2 \times 10^{10}$', '$12 \times 10^{10}$']
answer = '$1.2 \times 10^{8}$'
answer_value = 1.2e8
check = "3 * 10^5 * 4 * 10^2"
explanation = '''
Multiply the numbers and the powers of ten separately: $3 \times 4 = 12$ and $10^{5} \times 10^{2} = 10^{7}$.
That gives $12 \times 10^{7}$. In scientific notation the first number must be less than 10,
so write $12 = 1.2 \times 10^{1}$: the answer is $1.2 \times 10^{8}$.
'''
common_mistake = "Multiplying the exponents (5 × 2 = 10) instead of adding them."
