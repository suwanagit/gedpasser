# Data displays and statistics (Q.6.a-c, Q.7.a)
# Text conventions: math goes in $...$ (KaTeX); a literal dollar sign is \$.

[[question]]
id = "q-data-stats-0001"
skill = "q-data-stats"
principle = "Q.7.a"
difficulty = 1
type = "fill_in"
status = "reviewed"
alaska = true
prompt = '''
The daily high temperatures in Nome for five days were $-2$, $1$, $4$, $0$ and $-3$ degrees Celsius.
What was the mean daily high, in degrees Celsius?
'''
answer = "0"
check = "(-2 + 1 + 4 + 0 - 3) / 5"
explanation = '''
Add the values: $-2 + 1 + 4 + 0 + (-3) = 0$.
Divide by the number of days: $0 \div 5 = 0$ °C.
'''
common_mistake = "Ignoring the minus signs and adding 2 + 1 + 4 + 0 + 3 = 10, giving a mean of 2."

[[question]]
id = "q-data-stats-0002"
skill = "q-data-stats"
principle = "Q.7.a"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = "The ages of six people in a study group are 18, 25, 31, 22, 40 and 27. What is the median age?"
choices = ["26", "25", "26.5", "31"]
answer = "26"
check = "(25 + 27) / 2"
explanation = '''
Put the ages in order: 18, 22, 25, 27, 31, 40.
With six values, the median is the mean of the middle two: $(25 + 27) \div 2 = 26$.
'''
common_mistake = "Taking the middle of the list without sorting it first."

[[question]]
id = "q-data-stats-0003"
skill = "q-data-stats"
principle = "Q.7.a"
difficulty = 3
type = "multiple_choice"
status = "reviewed"
prompt = '''
In a class, tests count for 60% of the final grade and homework counts for 40%.
A student has a test average of 70 and a homework average of 90. What is the final grade?
'''
choices = ["78", "80", "82", "76"]
answer = "78"
check = "0.6 * 70 + 0.4 * 90"
explanation = '''
Weight each average: $0.6 \times 70 = 42$ and $0.4 \times 90 = 36$.
Add them: $42 + 36 = 78$.
'''
common_mistake = "Taking the plain average (70 + 90) ÷ 2 = 80, which ignores the weights."

[[question]]
id = "q-data-stats-0004"
skill = "q-data-stats"
principle = "Q.6.a"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
alaska = true
prompt = '''
A circle graph shows how the 600 households in a town heat their homes: oil 45%, wood 30%, electric 15% and other 10%.
How many households heat with wood?
'''
choices = ["180", "30", "270", "200"]
answer = "180"
check = "0.30 * 600"
explanation = 'Find 30% of 600: $0.30 \times 600 = 180$ households.'
common_mistake = "Giving the percent (30) instead of the number of households."

[[question]]
id = "q-data-stats-0005"
skill = "q-data-stats"
principle = "Q.6.a"
difficulty = 2
type = "fill_in"
status = "reviewed"
alaska = true
prompt = '''
A bar graph shows salmon counted at a river weir: 1,250 on Monday, 980 on Tuesday and 1,630 on Wednesday.
How many more salmon were counted on Wednesday than on Tuesday?
'''
answer = "650"
check = "1630 - 980"
explanation = 'Subtract the two bar heights: $1630 - 980 = 650$ salmon.'
common_mistake = "Comparing Wednesday with Monday (380) instead of Tuesday."

[question.figure]
kind = "bars"
bars = [{ label = "Mon", value = 1250 }, { label = "Tue", value = 980 }, { label = "Wed", value = 1630 }]
y_label = "salmon"

[[question]]
id = "q-data-stats-0006"
skill = "q-data-stats"
principle = "Q.6.b"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = '''
A box plot of test scores shows: minimum 52, first quartile 64, median 71, third quartile 80, maximum 95.
What is the interquartile range?
'''
choices = ["16", "43", "9", "7"]
answer = "16"
check = "80 - 64"
explanation = 'The interquartile range is the third quartile minus the first quartile: $80 - 64 = 16$.'
common_mistake = "Finding the full range (95 − 52 = 43) instead of the interquartile range."

[question.figure]
kind = "box"
min = 52
q1 = 64
median = 71
q3 = 80
max = 95
axis_min = 50
axis_max = 100
label = "test score"

[[question]]
id = "q-data-stats-0007"
skill = "q-data-stats"
principle = "Q.6.b"
difficulty = 2
type = "fill_in"
status = "reviewed"
prompt = '''
A dot plot shows how many fish each of 10 people caught: 1 dot above 0, 3 dots above 1, 4 dots above 2 and 2 dots above 3.
How many fish were caught in all?
'''
answer = "17"
check = "0 * 1 + 1 * 3 + 2 * 4 + 3 * 2"
explanation = '''
Each dot is one person. Multiply each number of fish by its number of dots and add:
$0 \times 1 + 1 \times 3 + 2 \times 4 + 3 \times 2 = 0 + 3 + 8 + 6 = 17$ fish.
'''
common_mistake = "Counting the dots (10 people) instead of the fish they caught."

[question.figure]
kind = "dots"
counts = [{ x = 0, count = 1 }, { x = 1, count = 3 }, { x = 2, count = 4 }, { x = 3, count = 2 }]
label = "fish caught"

[[question]]
id = "q-data-stats-0008"
skill = "q-data-stats"
principle = "Q.6.c"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = '''
A table shows hours worked and pay: 2 hours earns \$36, 5 hours earns \$90 and 8 hours earns \$144.
At the same rate, how many dollars are earned for 6 hours?
'''
choices = ["108", "90", "126", "117"]
answer = "108"
check = "36 / 2 * 6"
explanation = '''
The pay per hour is the same in every row: $36 \div 2 = 18$, $90 \div 5 = 18$, $144 \div 8 = 18$.
For 6 hours: $18 \times 6 = 108$ dollars.
'''
common_mistake = "Picking a value between the rows for 5 and 8 hours (such as 117) instead of using the hourly rate."

[[question]]
id = "q-data-stats-0009"
skill = "q-data-stats"
principle = "Q.6.c"
difficulty = 1
type = "fill_in"
status = "reviewed"
alaska = true
prompt = '''
A line graph shows a river's depth: 1.2 m on May 1, 2.0 m on May 15 and 2.6 m on June 1.
By how many meters did the river rise from May 1 to June 1?
'''
answer = "1.4"
check = "2.6 - 1.2"
explanation = 'Subtract the starting depth from the ending depth: $2.6 - 1.2 = 1.4$ m.'
common_mistake = "Using the May 15 reading (2.0 − 1.2 = 0.8) instead of the June 1 reading."

[question.figure]
kind = "plane"
x_min = 0
x_max = 35
y_min = 0
y_max = 3
points = [{ x = 0, y = 1.2, label = "May 1: 1.2 m" }, { x = 14, y = 2.0, label = "May 15: 2.0 m" }, { x = 31, y = 2.6, label = "Jun 1: 2.6 m" }]
segments = [{ from = [0, 1.2], to = [14, 2.0] }, { from = [14, 2.0], to = [31, 2.6] }]
x_label = "days after May 1"
y_label = "depth (m)"

[[question]]
id = "q-data-stats-0010"
skill = "q-data-stats"
principle = "Q.7.a"
difficulty = 2
type = "fill_in"
status = "reviewed"
prompt = "The mean of five numbers is 18. Four of the numbers are 12, 20, 15 and 21. What is the fifth number?"
answer = "22"
check = "5 * 18 - (12 + 20 + 15 + 21)"
explanation = '''
If the mean of 5 numbers is 18, their total is $5 \times 18 = 90$.
The four known numbers add to $12 + 20 + 15 + 21 = 68$, so the fifth is $90 - 68 = 22$.
'''
common_mistake = "Averaging the four known numbers (17) instead of finding the total that all five numbers need."

[[question]]
id = "q-data-stats-0011"
skill = "q-data-stats"
principle = "Q.7.a"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
prompt = "What is the range of these numbers: 14, 9, 22, 17, 9, 30?"
choices = ["21", "9", "16.8", "30"]
answer = "21"
check = "30 - 9"
explanation = 'The range is the largest value minus the smallest: $30 - 9 = 21$.'
common_mistake = "Giving the mode (9) or the largest value (30) instead of the difference."

[[question]]
id = "q-data-stats-0012"
skill = "q-data-stats"
principle = "Q.7.a"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
prompt = "What is the mode of these numbers: 4, 7, 7, 2, 9, 4, 7, 1?"
choices = ["7", "4", "5.125", "8"]
answer = "7"
check = "7"
explanation = '''
The mode is the value that appears most often.
7 appears three times, 4 appears twice, and every other value appears once. The mode is 7.
'''
common_mistake = "Finding the mean (41 ÷ 8 = 5.125) instead of the most common value."
