[[stimulus]]
id = "science-fertilizer"
status = "draft"
title = "A tomato experiment"
text = '''
A gardener wants to know if fertilizer helps tomato plants produce more fruit. She grows 12 tomato plants of the same kind in one greenhouse. She splits them into three groups of 4 plants. Each week, one group gets no fertilizer, one gets 5 grams, and one gets 10 grams. All plants get the same amount of water and light.

After 8 weeks, she weighs the tomatoes from each plant and finds the average for each group.
'''
table = { headers = ["Fertilizer each week (g)", "Average tomato mass per plant (g)"], rows = [["0", "410"], ["5", "620"], ["10", "640"]] }
source = "Original (made-up results for practice)"

[[stimulus]]
id = "science-insulation"
status = "draft"
title = "Keeping a drink hot"
text = '''
A student wants to find out which material keeps a hot drink hot the longest. She fills four identical cups with 200 mL of water at 80 °C. She wraps each of three cups in a different material and leaves the fourth cup unwrapped. All four cups sit on the same table. After 20 minutes, she measures the water temperature in each cup.
'''
table = { headers = ["Wrapping", "Water temperature after 20 minutes (°C)"], rows = [["None", "52"], ["Aluminum foil", "55"], ["Cotton cloth", "61"], ["Wool", "66"]] }
source = "Original (made-up results for practice)"

