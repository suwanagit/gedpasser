status = "reviewed"
title = "A tomato experiment"
text = '''
A gardener wants to know if fertilizer helps tomato plants produce more fruit. She grows 12 tomato plants of the same kind in one greenhouse. She splits them into three groups of 4 plants. Each week, one group gets no fertilizer, one gets 5 grams, and one gets 10 grams. All plants get the same amount of water and light.

After 8 weeks, she weighs the tomatoes from each plant and finds the average for each group.
'''
