[[stimulus]]
id = "science-seasons"
status = "reviewed"
title = "Why we have seasons"
text = '''
Earth's axis, the line it spins around, is tilted about 23.5° from straight up and down, compared with its path around the Sun. The tilt stays pointed the same way in space all year.

In June, the northern half of Earth leans toward the Sun. Sunlight hits it more directly and days are longer, so it is summer there. At the same time, the southern half leans away from the Sun, so it is winter there. In December, it is the other way around.

In June, the area around the North Pole gets sunlight all day and all night. Every place north of the Arctic Circle, at about 66.5° north, has at least one day around then when the Sun never sets.
'''
source = "Original (facts from OpenStax Astronomy 2e 4.2 The Seasons and the National Snow and Ice Data Center, Arctic Weather and Climate)"

