source = "Original (made-up results for practice)"

[[stimulus]]
id = "science-insulation"
status = "reviewed"
title = "Keeping a drink hot"
text = '''
A student wants to find out which material keeps a hot drink hot the longest. She fills four identical cups with 200 mL of water at 80 °C. She wraps each of three cups in a different material and leaves the fourth cup unwrapped. All four cups sit on the same table. After 20 minutes, she measures the water temperature in each cup.
'''
