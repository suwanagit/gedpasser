text = '''
In the northern forests of North America, including Alaska, the lynx is a wild cat that hunts snowshoe hares. Hares are its main food. Scientists have found that the two populations rise and fall in cycles of about ten years. When there are many hares, there is more food for lynx, and the lynx population grows. When lynx become common, they eat so many hares that the hare population falls. Then the lynx have less food, and their numbers fall too, about a year or two after the hares.

