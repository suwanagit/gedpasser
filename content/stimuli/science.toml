[[stimulus]]
id = "science-yeast"
status = "draft"
title = "Yeast and temperature"
text = '''
Yeast are tiny living fungi. When yeast break down sugar without oxygen, a process called fermentation, they give off carbon dioxide gas.

A student puts the same amount of yeast, sugar and water into four bottles. Each bottle is kept at a different water temperature. She stretches a balloon over the top of each bottle. After 30 minutes, she measures how wide each balloon has become.
'''
table = { headers = ["Water temperature (°C)", "Balloon width after 30 minutes (cm)"], rows = [["10", "3"], ["25", "9"], ["40", "14"], ["60", "2"]] }
source = "Original (made-up results for practice; facts from OpenStax Concepts of Biology 4.4 Fermentation and 13.4 Fungi)"

