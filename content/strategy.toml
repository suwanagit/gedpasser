# ── Test-day tactics (40 words max each) ─────────────────────────────────

[[tactic]]
id = "no-blanks"
title = "Never leave a blank"
text = "A wrong answer costs nothing. Before time runs out, put an answer on every question."

[[tactic]]
id = "flag"
title = "Flag it and move on"
text = "Stuck for two minutes? Pick your best guess, flag the question, and come back if there is time."

[[tactic]]
id = "pace"
title = "Watch your pace"
text = "Aim for about two and a half minutes per question. At the halfway point, check that you are about halfway through."

[[tactic]]
id = "formula-sheet"
title = "Use the formula sheet"
text = "You get a formula sheet. Don't memorize every formula — know what is on it and practice using it."

[[tactic]]
id = "backsolve"
title = "Plug in the choices"
text = "Solving for x with answer choices? Put each choice into the equation. The one that works is the answer."

[[tactic]]
id = "pick-numbers"
title = "Pick your own numbers"
text = "If the choices are expressions, choose a small number like x = 2. Work out the original and each choice; the match wins."

[[tactic]]
id = "estimate"
title = "Estimate, then eliminate"
text = "Round the numbers and get a rough answer first. Cross out choices that are way off."

[[tactic]]
id = "last-line"
title = "Read the question line first"
text = "Find what is actually being asked before working with the numbers, so you solve for the right thing."

[[tactic]]
id = "units"
title = "Check the units"
text = "Change everything to the same units before you calculate: cm with cm, hours with hours."

[[tactic]]
id = "answer-asked"
title = "Answer what was asked"
text = "If it asks for the width, don't stop at the length. Reread the question before you pick."

[[tactic]]
id = "calculator"
title = "Use the calculator wisely"
text = "Use it for messy arithmetic, with parentheses for groups. Keep basic arithmetic sharp too, in case a question doesn't allow it."

[[tactic]]
id = "rest"
title = "Sleep beats cramming"
text = "The night before, review your hacks for 20 minutes, then sleep. A rested brain scores higher than a tired one."

# ── Formula sheet ────────────────────────────────────────────────────────

[[formula]]
group = "Area"
name = "Rectangle"
tex = 'A = lw'

[[formula]]
group = "Area"
name = "Triangle"
tex = 'A = \tfrac{1}{2}bh'

[[formula]]
group = "Area"
name = "Parallelogram"
tex = 'A = bh'

[[formula]]
group = "Area"
name = "Trapezoid"
tex = 'A = \tfrac{1}{2}(b_1 + b_2)h'

[[formula]]
group = "Circles"
name = "Circumference"
tex = 'C = 2\pi r = \pi d'

[[formula]]
group = "Circles"
name = "Area"
tex = 'A = \pi r^2'

[[formula]]
group = "Right triangles"
name = "Pythagorean theorem"
tex = 'a^2 + b^2 = c^2'

[[formula]]
group = "Volume"
name = "Prism or box"
tex = 'V = Bh \quad (B = \text{base area})'

[[formula]]
group = "Volume"
name = "Cylinder"
tex = 'V = \pi r^2 h'

[[formula]]
group = "Volume"
name = "Pyramid"
tex = 'V = \tfrac{1}{3}Bh'

[[formula]]
group = "Volume"
name = "Cone"
tex = 'V = \tfrac{1}{3}\pi r^2 h'

[[formula]]
group = "Volume"
name = "Sphere"
tex = 'V = \tfrac{4}{3}\pi r^3'

[[formula]]
group = "Surface area"
name = "Box"
tex = 'SA = 2lw + 2lh + 2wh'

[[formula]]
group = "Surface area"
name = "Cylinder"
tex = 'SA = 2\pi r^2 + 2\pi r h'

[[formula]]
group = "Surface area"
name = "Sphere"
tex = 'SA = 4\pi r^2'

[[formula]]
group = "Lines"
name = "Slope"
tex = 'm = \dfrac{y_2 - y_1}{x_2 - x_1}'

[[formula]]
group = "Lines"
name = "Slope-intercept form"
tex = 'y = mx + b'

[[formula]]
group = "Lines"
name = "Point-slope form"
tex = 'y - y_1 = m(x - x_1)'

[[formula]]
group = "Algebra"
name = "Quadratic formula"
tex = 'x = \dfrac{-b \pm \sqrt{b^2 - 4ac}}{2a}'

[[formula]]
group = "Money and motion"
name = "Simple interest"
tex = 'I = prt'

[[formula]]
group = "Money and motion"
name = "Distance"
tex = 'd = rt'

[[formula]]
group = "Money and motion"
name = "Total cost"
tex = '\text{total} = (\text{number of units})(\text{price per unit})'
