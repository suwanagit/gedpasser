sources = ["Original passage science-water-cycle", "OpenStax Concepts of Biology 20.2 Biogeochemical Cycles: https://openstax.org/books/concepts-biology/pages/20-2-biogeochemical-cycles"]
prompt = "Which statement describes the table?"
choices = ["Almost all of Earth's water is salt water", "Most of Earth's water is fresh water", "Earth has about the same amount of salt water as fresh water", "Fresh water makes up about a quarter of Earth's water"]
answer = "Almost all of Earth's water is salt water"
explanation = '''
Salt water is 97.5% of all water on Earth. Fresh water is only 2.5%.
So **almost all of Earth's water is salt water**.
'''
common_mistake = "Reading 2.5% as a quarter. A quarter is 25%, ten times as much."

[[question]]
id = "s-reading-0019"
skill = "s-reading"
principle = "SP.6.c"
topic = "ES.a.1"
difficulty = 3
type = "multiple_choice"
status = "draft"
stimulus = "science-water-cycle"
sources = ["Original passage science-water-cycle", "OpenStax Concepts of Biology 20.2 Biogeochemical Cycles: https://openstax.org/books/concepts-biology/pages/20-2-biogeochemical-cycles"]
prompt = "Which sentence matches the table?"
choices = ["About 1 out of every 40 liters of Earth's water is fresh water", "About 1 out of every 4 liters of Earth's water is fresh water", "About 1 out of every 25 liters of Earth's water is fresh water", "About 1 out of every 400 liters of Earth's water is fresh water"]
answer = "About 1 out of every 40 liters of Earth's water is fresh water"
explanation = '''
Fresh water is 2.5%, which means 2.5 out of every 100 liters.
100 ÷ 2.5 = 40.
So **about 1 out of every 40 liters** is fresh water.
'''
common_mistake = "Picking 1 out of 25 by mixing up 2.5% with 1/25. 1/25 is 4%."

# ── Stand-alone ───────────────────────────────────────────────────────

[[question]]
id = "s-reading-0020"
skill = "s-reading"
principle = "SP.1.b"
topic = "P.c.3"
difficulty = 2
type = "multiple_choice"
status = "draft"
sources = ["OpenStax Chemistry 2e 4.1 Writing and Balancing Chemical Equations: https://openstax.org/books/chemistry-2e/pages/4-1-writing-and-balancing-chemical-equations"]
prompt = "A science book shows this equation for burning methane: CH₄ + 2O₂ → CO₂ + 2H₂O. What does the arrow (→) mean?"
choices = ["The substances on the left react to make the substances on the right", "The two sides are the same substance", "The substances on the right break down into the substances on the left", "The reaction gives off heat"]
answer = "The substances on the left react to make the substances on the right"
explanation = '''
In a chemical equation, the reactants go on the left and the products go on the right.
The arrow points from what reacts to what is made.
So the arrow means **the substances on the left react to make the substances on the right**.
'''
common_mistake = "Treating the arrow like an equals sign. The two sides hold the same atoms, but they are different substances."

[[question]]
id = "s-reading-0021"
skill = "s-reading"
principle = "SP.1.b"
topic = "P.c.3"
difficulty = 3
type = "multiple_choice"
status = "draft"
sources = ["OpenStax Chemistry 2e 4.1 Writing and Balancing Chemical Equations: https://openstax.org/books/chemistry-2e/pages/4-1-writing-and-balancing-chemical-equations"]
prompt = "In the equation Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g), which product is a gas?"
choices = ["H₂", "ZnCl₂", "Zn", "HCl"]
answer = "H₂"
explanation = '''
The products are on the right of the arrow: ZnCl₂ and H₂.
The letter in parentheses shows the state: (s) solid, (l) liquid, (g) gas, (aq) dissolved in water.
H₂ has (g), so **H₂** is the gas.
'''
common_mistake = "Picking HCl or Zn. They are on the left of the arrow, so they are reactants, not products."
