prompt = "Complete the sentence about the table: each trophic level holds about {{1}} of the energy of the level below it, so the {{2}} hold the least energy."
blanks = [
  { choices = ["one-tenth", "one-half", "ten times"], answer = "one-tenth" },
  { choices = ["snakes", "grasshoppers", "grass"], answer = "snakes" },
]
explanation = '''
2,000 ÷ 20,000 = 0.1, and 200 ÷ 2,000 = 0.1. That is **one-tenth** each time.
The smallest number, 20, belongs to the **snakes**.
'''
common_mistake = "Picking \"ten times\". The energy shrinks going up the chain; it does not grow."

