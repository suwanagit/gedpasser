status = "draft"
stimulus = "science-water-cycle"
sources = ["Original passage science-water-cycle", "OpenStax Concepts of Biology 20.2 Biogeochemical Cycles: https://openstax.org/books/concepts-biology/pages/20-2-biogeochemical-cycles"]
prompt = "In the passage, what does evaporates mean?"
choices = ["Changes from a liquid into a gas", "Changes from a gas into tiny droplets", "Falls as rain or snow", "Soaks into the ground"]
answer = "Changes from a liquid into a gas"
explanation = '''
The passage says the water "evaporates, which means it changes from a liquid into a gas".
So evaporates means **changes from a liquid into a gas**.
'''
common_mistake = "Picking \"changes from a gas into tiny droplets\", which the passage calls condensing."

[[question]]
id = "s-reading-0017"
skill = "s-reading"
principle = "SP.1.a"
topic = "ES.a.1"
difficulty = 2
type = "order"
status = "draft"
stimulus = "science-water-cycle"
sources = ["Original passage science-water-cycle", "OpenStax Concepts of Biology 20.2 Biogeochemical Cycles: https://openstax.org/books/concepts-biology/pages/20-2-biogeochemical-cycles"]
prompt = "Put these steps of the water cycle in the order the passage describes them."
items = [
  "The Sun warms water in the ocean",
  "Water evaporates and rises as water vapor",
  "Water vapor cools and forms clouds",
  "Water falls as rain or snow",
]
explanation = '''
First the Sun warms the water. Then some of it evaporates and rises as water vapor.
The vapor cools and condenses into clouds.
Last, **the water falls as rain or snow**.
'''
common_mistake = "Putting clouds before evaporation. Clouds form from water vapor, so the water has to evaporate first."

[[question]]
id = "s-reading-0018"
skill = "s-reading"
