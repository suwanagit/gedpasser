# ── Keeping body temperature steady (science-body-temperature) ─────────

[[question]]
id = "s-reading-0001"
skill = "s-reading"
principle = "SP.1.a"
topic = "L.a.2"
difficulty = 1
type = "multiple_choice"
status = "draft"
stimulus = "science-body-temperature"
sources = ["Original passage science-body-temperature", "OpenStax Anatomy and Physiology 2e 1.5 Homeostasis: https://openstax.org/books/anatomy-and-physiology-2e/pages/1-5-homeostasis", "OpenStax Concepts of Biology 16.1 Homeostasis and Osmoregulation: https://openstax.org/books/concepts-biology/pages/16-1-homeostasis-and-osmoregulation"]
prompt = "What is the main idea of the passage?"
choices = ["The body uses automatic responses to keep its temperature near a set point", "Sweating is the only way the body cools down", "Shivering happens when the muscles are tired", "Body temperature changes a lot during a normal day"]
answer = "The body uses automatic responses to keep its temperature near a set point"
explanation = '''
The passage explains how the body cools down when hot and warms up when cold.
Both ways push the temperature back toward the set point.
So the main idea is that **the body uses automatic responses to keep its temperature near a set point**.
'''
common_mistake = "Picking a detail, like sweating, that is only one part of the passage."

[[question]]
id = "s-reading-0002"
skill = "s-reading"
principle = "SP.1.b"
topic = "L.a.2"
difficulty = 1
type = "multiple_choice"
status = "draft"
stimulus = "science-body-temperature"
sources = ["Original passage science-body-temperature", "OpenStax Anatomy and Physiology 2e 1.5 Homeostasis: https://openstax.org/books/anatomy-and-physiology-2e/pages/1-5-homeostasis"]
prompt = "In the passage, what does homeostasis mean?"
choices = ["Keeping conditions inside the body steady", "Making heat by shivering", "The part of the brain that senses temperature", "Losing heat through sweat"]
answer = "Keeping conditions inside the body steady"
explanation = '''
The passage says: "Keeping conditions inside the body steady like this is called homeostasis."
So homeostasis means **keeping conditions inside the body steady**.
'''
common_mistake = "Picking the hypothalamus, which is the brain part that controls homeostasis, not homeostasis itself."

[[question]]
id = "s-reading-0003"
skill = "s-reading"
principle = "SP.1.a"
topic = "L.a.2"
difficulty = 2
type = "multiple_choice"
status = "draft"
stimulus = "science-body-temperature"
sources = ["Original passage science-body-temperature", "OpenStax Anatomy and Physiology 2e 1.5 Homeostasis: https://openstax.org/books/anatomy-and-physiology-2e/pages/1-5-homeostasis", "OpenStax Concepts of Biology 16.1 Homeostasis and Osmoregulation: https://openstax.org/books/concepts-biology/pages/16-1-homeostasis-and-osmoregulation"]
prompt = "According to the passage, how is the body's response to cold different from its response to heat?"
choices = ["Blood vessels near the skin narrow instead of widening", "The sweat glands make more sweat", "The hypothalamus stops working", "The body stops using negative feedback"]
answer = "Blood vessels near the skin narrow instead of widening"
explanation = '''
When you are too hot, blood vessels near the skin widen so heat escapes.
When you are too cold, they narrow to keep warm blood deeper in the body.
So the difference is that **blood vessels near the skin narrow instead of widening**.
'''
common_mistake = "Picking more sweat, which is part of the response to heat, not cold."

[[question]]
id = "s-reading-0004"
skill = "s-reading"
principle = "SP.1.b"
topic = "L.a.2"
difficulty = 2
type = "multiple_choice"
status = "draft"
stimulus = "science-body-temperature"
sources = ["Original passage science-body-temperature", "OpenStax Anatomy and Physiology 2e 1.5 Homeostasis: https://openstax.org/books/anatomy-and-physiology-2e/pages/1-5-homeostasis", "OpenStax Concepts of Biology 16.1 Homeostasis and Osmoregulation: https://openstax.org/books/concepts-biology/pages/16-1-homeostasis-and-osmoregulation"]
prompt = "As the passage uses the term, what is negative feedback?"
choices = ["A response that pushes a change back toward the set point", "A response that makes a change even bigger", "A sign that the body is sick", "A drop in body temperature"]
answer = "A response that pushes a change back toward the set point"
explanation = '''
The passage says the body's response "pushes the temperature back toward the set point".
It calls this kind of control negative feedback.
So negative feedback is **a response that pushes a change back toward the set point**.
'''
common_mistake = "Reading negative to mean bad or going down. Here it means the response undoes the change."

# ── How plants make food (science-photosynthesis) ─────────────────────

[[question]]
id = "s-reading-0005"
skill = "s-reading"
principle = "SP.1.b"
topic = "L.b.1"
difficulty = 1
type = "multiple_choice"
status = "draft"
stimulus = "science-photosynthesis"
sources = ["Original passage science-photosynthesis", "OpenStax Concepts of Biology 5.1 Overview of Photosynthesis: https://openstax.org/books/concepts-biology/pages/5-1-overview-of-photosynthesis"]
prompt = "In the passage, what are the products of photosynthesis?"
choices = ["Glucose and oxygen", "Carbon dioxide and water", "Sunlight and water", "Carbon dioxide and oxygen"]
answer = "Glucose and oxygen"
explanation = '''
The passage says products are "the materials it makes".
Photosynthesis makes glucose and gives off oxygen.
So the products are **glucose and oxygen**.
'''
common_mistake = "Picking carbon dioxide and water, which are the reactants: what goes in, not what comes out."

