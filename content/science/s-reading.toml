# ── Three ways heat moves (science-heat-transfer) ─────────────────────

[[question]]
id = "s-reading-0008"
skill = "s-reading"
principle = "SP.1.b"
topic = "P.a.1"
difficulty = 1
type = "multiple_choice"
status = "draft"
stimulus = "science-heat-transfer"
sources = ["Original passage science-heat-transfer", "OpenStax College Physics 2e 14.4 Heat Transfer Methods: https://openstax.org/books/college-physics-2e/pages/14-4-heat-transfer-methods"]
prompt = "In the passage, what does conduction mean?"
choices = ["Heat moving through matter that is touching", "Heat carried by a moving liquid or gas", "Heat carried by light and other waves", "Heat moving from cooler things to warmer things"]
answer = "Heat moving through matter that is touching"
explanation = '''
The passage says: "Conduction is heat moving through matter that is touching."
Its example is a burner heating the pan that sits on it.
So conduction means **heat moving through matter that is touching**.
'''
common_mistake = "Mixing it up with convection, which needs a moving liquid or gas."

[[question]]
id = "s-reading-0009"
skill = "s-reading"
principle = "SP.1.a"
topic = "P.a.1"
difficulty = 2
type = "sort"
status = "draft"
stimulus = "science-heat-transfer"
sources = ["Original passage science-heat-transfer", "OpenStax College Physics 2e 14.4 Heat Transfer Methods: https://openstax.org/books/college-physics-2e/pages/14-4-heat-transfer-methods", "OpenStax College Physics 2e 14.6 Convection: https://openstax.org/books/college-physics-2e/pages/14-6-convection", "OpenStax College Physics 2e 14.7 Radiation: https://openstax.org/books/college-physics-2e/pages/14-7-radiation"]
prompt = "Sort each example from the passage by the way heat moves."
groups = [
  { name = "Conduction", items = ["Burner heating the bottom of a pan", "Heat spreading to the pan's handle"] },
  { name = "Convection", items = ["Warm water rising in a pot"] },
  { name = "Radiation", items = ["Sunlight warming Earth", "Campfire warming your face"] },
]
explanation = '''
Conduction: the passage's examples are the **burner heating the pan** and **heat spreading to the handle**.
Convection: its example is **warm water rising in a pot**.
Radiation: its examples are **sunlight warming Earth** and **a campfire warming your face**.
'''
common_mistake = "Putting the campfire under conduction. Your face is not touching the fire; the heat comes by radiation."

[[question]]
id = "s-reading-0010"
skill = "s-reading"
principle = "SP.1.a"
topic = "P.a.1"
difficulty = 2
type = "multiple_choice"
status = "draft"
stimulus = "science-heat-transfer"
sources = ["Original passage science-heat-transfer", "OpenStax College Physics 2e 14.1 Heat: https://openstax.org/books/college-physics-2e/pages/14-1-heat", "OpenStax College Physics 2e 14.4 Heat Transfer Methods: https://openstax.org/books/college-physics-2e/pages/14-4-heat-transfer-methods", "OpenStax College Physics 2e 14.7 Radiation: https://openstax.org/books/college-physics-2e/pages/14-7-radiation"]
prompt = "According to the passage, how is radiation different from conduction and convection?"
choices = ["It can move heat through empty space", "It moves heat from cooler things to warmer things", "It works only in liquids", "It needs matter that is touching"]
answer = "It can move heat through empty space"
explanation = '''
Conduction needs matter that is touching. Convection needs a moving liquid or gas.
The passage says radiation "does not need any matter", which is how the Sun's heat crosses space.
So radiation **can move heat through empty space**.
'''
common_mistake = "Picking \"matter that is touching\", which describes conduction."

# ── Energy in a food chain (science-food-chain) ───────────────────────

[[question]]
id = "s-reading-0011"
skill = "s-reading"
principle = "SP.6.c"
topic = "L.c.1"
difficulty = 1
type = "multiple_choice"
status = "draft"
stimulus = "science-food-chain"
sources = ["Original passage science-food-chain", "OpenStax Concepts of Biology 20.1 Energy Flow through Ecosystems: https://openstax.org/books/concepts-biology/pages/20-1-energy-flow-through-ecosystems"]
prompt = "Which statement describes the table?"
choices = ["Each level holds less energy than the level below it", "Each level holds more energy than the level below it", "Every level holds the same amount of energy", "The snakes hold the most energy"]
answer = "Each level holds less energy than the level below it"
explanation = '''
The energy goes 20,000, then 2,000, then 200, then 20.
Each number is smaller than the one before it.
So **each level holds less energy than the level below it**.
'''
common_mistake = "Thinking the top animal holds the most because it eats the others."

