# ── Earthquakes at one station (science-quakes) ───────────────────────

[[question]]
id = "s-displays-0001"
skill = "s-displays"
principle = "SP.1.c"
topic = "ES.a.2"
difficulty = 1
type = "multiple_choice"
status = "draft"
stimulus = "science-quakes"
sources = ["Original passage science-quakes", "USGS Earthquake Hazards Program, Lists, Maps, and Statistics: https://www.usgs.gov/programs/earthquake-hazards/lists-maps-and-statistics"]
prompt = "According to the table, which magnitude of earthquake did the station record most often?"
choices = ["Magnitude 2", "Magnitude 3", "Magnitude 4", "Magnitude 5"]
answer = "Magnitude 2"
explanation = '''
The biggest count shows the magnitude recorded most often.
Magnitude 2 has 1,000 earthquakes, more than any other row.
So the station recorded **magnitude 2** earthquakes most often.
'''
common_mistake = "Picking magnitude 5 because it is the strongest. Strongest is not the same as most often."

[[question]]
id = "s-displays-0002"
skill = "s-displays"
principle = "SP.1.c"
topic = "ES.a.2"
difficulty = 2
type = "multiple_choice"
status = "draft"
stimulus = "science-quakes"
sources = ["Original passage science-quakes", "USGS Earthquake Hazards Program, Lists, Maps, and Statistics: https://www.usgs.gov/programs/earthquake-hazards/lists-maps-and-statistics"]
prompt = "Which statement describes the pattern in the table?"
choices = ["The stronger the earthquake, the fewer of them the station recorded", "The stronger the earthquake, the more of them the station recorded", "The station recorded about the same number of each magnitude", "Most of the earthquakes were magnitude 5"]
answer = "The stronger the earthquake, the fewer of them the station recorded"
explanation = '''
Going from magnitude 2 to 5, the counts go 1,000, then 100, then 10, then 1.
Each stronger group has fewer earthquakes.
So **the stronger the earthquake, the fewer of them the station recorded**.
'''
common_mistake = "Reading the table from the bottom up and seeing the counts grow. The magnitudes increase going down the table."

[[question]]
id = "s-displays-0003"
skill = "s-displays"
principle = "SP.6.b"
topic = "ES.a.2"
difficulty = 2
type = "fill_in"
status = "draft"
stimulus = "science-quakes"
sources = ["Original passage science-quakes", "USGS Earthquake Hazards Program, Lists, Maps, and Statistics: https://www.usgs.gov/programs/earthquake-hazards/lists-maps-and-statistics"]
prompt = "How many more magnitude 3 earthquakes than magnitude 4 earthquakes did the station record?"
answer = "90"
check = "100 - 10"
explanation = '''
A "how many more" question asks for a difference, so subtract.
Magnitude 3: 100. Magnitude 4: 10. 100 − 10 = 90.
So the station recorded **90** more magnitude 3 earthquakes.
'''
common_mistake = "Answering 10 because magnitude 3 has ten times as many. The question asks how many more, which is a difference."

# ── Temperature and height (science-balloon) ──────────────────────────

[[question]]
id = "s-displays-0004"
skill = "s-displays"
principle = "SP.1.c"
topic = "ES.b.1"
difficulty = 1
type = "fill_in"
status = "draft"
stimulus = "science-balloon"
sources = ["Original passage science-balloon", "OpenStax Astronomy 2e 8.3 Earth's Atmosphere: https://openstax.org/books/astronomy-2e/pages/8-3-earths-atmosphere"]
prompt = "According to the graph, what was the air temperature, in °C, at a height of 6 km?"
answer = "-10"
check = "-10"
explanation = '''
Find 6 km along the bottom axis and go down to the line.
Then read across to the temperature axis: the point is at −10.
So the temperature at 6 km was **−10 °C**.
'''
common_mistake = "Dropping the minus sign. The point is below 0, so the temperature is −10 °C, not 10 °C."

[[question]]
id = "s-displays-0005"
skill = "s-displays"
principle = "SP.6.b"
topic = "ES.b.1"
difficulty = 3
type = "fill_in"
status = "draft"
stimulus = "science-balloon"
sources = ["Original passage science-balloon", "OpenStax Astronomy 2e 8.3 Earth's Atmosphere: https://openstax.org/books/astronomy-2e/pages/8-3-earths-atmosphere"]
prompt = "Based on the graph, by how many degrees Celsius did the temperature drop for each 1 km the balloon rose?"
answer = "5"
check = "(20 - (-20)) / 8"
explanation = '''
A drop for each kilometer is a rate: the total change divided by the distance.
From 0 km to 8 km the temperature went from 20 °C to −20 °C, a drop of 20 − (−20) = 40 degrees.
The balloon rose 8 km, so divide: 40 ÷ 8 = 5.
So the temperature dropped by **5** degrees for each kilometer.
'''
common_mistake = "Answering 10, the drop between two points 2 km apart. That is the drop for every 2 km, not every 1 km."

[[question]]
id = "s-displays-0006"
skill = "s-displays"
principle = "SP.1.c"
topic = "ES.b.1"
difficulty = 1
type = "multiple_choice"
status = "draft"
stimulus = "science-balloon"
sources = ["Original passage science-balloon", "OpenStax Astronomy 2e 8.3 Earth's Atmosphere: https://openstax.org/books/astronomy-2e/pages/8-3-earths-atmosphere"]
prompt = "Which statement does the graph show?"
choices = ["The higher the balloon went, the colder the air was", "The higher the balloon went, the warmer the air was", "The air temperature stayed the same at every height", "The air was coldest at the ground"]
answer = "The higher the balloon went, the colder the air was"
explanation = '''
Moving right on the graph means going higher.
The line slopes down the whole way, from 20 °C to −20 °C.
So **the higher the balloon went, the colder the air was**.
'''
common_mistake = "Thinking higher means closer to the Sun and warmer. In this layer, the air gets colder as you go up."

# ── Heating ice (science-heating-curve) ───────────────────────────────

[[question]]
id = "s-displays-0007"
skill = "s-displays"
principle = "SP.1.c"
topic = "P.c.2"
difficulty = 2
type = "multiple_choice"
status = "draft"
stimulus = "science-heating-curve"
sources = ["Original passage science-heating-curve", "OpenStax Chemistry 2e 10.3 Phase Transitions: https://openstax.org/books/chemistry-2e/pages/10-3-phase-transitions"]
prompt = "Between points A and B, the temperature stays at 0 °C even though heat is still being added. What is happening during that time?"
choices = ["The ice is melting into liquid water", "The water is boiling", "The ice is getting colder", "The heater has been turned off"]
answer = "The ice is melting into liquid water"
explanation = '''
While a substance changes state, its temperature stays the same.
0 °C is the melting point of ice, and the flat part is at 0 °C.
So between A and B, **the ice is melting into liquid water**.
'''
common_mistake = "Picking \"the heater has been turned off\". The student heated it at a steady rate the whole time."

[[question]]
id = "s-displays-0008"
skill = "s-displays"
principle = "SP.1.c"
topic = "P.c.2"
difficulty = 1
type = "fill_in"
status = "draft"
stimulus = "science-heating-curve"
sources = ["Original passage science-heating-curve", "OpenStax Chemistry 2e 10.3 Phase Transitions: https://openstax.org/books/chemistry-2e/pages/10-3-phase-transitions"]
prompt = "According to the graph, at what temperature, in °C, did the water start to boil?"
answer = "100"
check = "100"
explanation = '''
The passage says the water starts to boil at point C.
Point C is at 100 °C.
So the water started to boil at **100 °C**.
'''
common_mistake = "Reading 0 °C, the flat part. That is melting, not boiling."

[[question]]
id = "s-displays-0009"
skill = "s-displays"
principle = "SP.6.b"
topic = "P.c.2"
difficulty = 2
type = "fill_in"
status = "draft"
stimulus = "science-heating-curve"
sources = ["Original passage science-heating-curve", "OpenStax Chemistry 2e 10.3 Phase Transitions: https://openstax.org/books/chemistry-2e/pages/10-3-phase-transitions"]
prompt = "According to the graph, for how many minutes was the ice melting, from point A to point B?"
answer = "40"
check = "50 - 10"
explanation = '''
Melting is the flat part at 0 °C, from point A to point B.
A is at 10 minutes and B is at 50 minutes, so 50 − 10 = 40.
So the ice was melting for **40** minutes.
'''
common_mistake = "Answering 50, the time at point B. That also counts the 10 minutes of warming the ice from −40 °C."

[[question]]
id = "s-displays-0010"
skill = "s-displays"
principle = "SP.1.c"
topic = "P.c.2"
difficulty = 3
type = "multiple_choice"
status = "draft"
stimulus = "science-heating-curve"
sources = ["Original passage science-heating-curve", "OpenStax Chemistry 2e 10.3 Phase Transitions: https://openstax.org/books/chemistry-2e/pages/10-3-phase-transitions"]
prompt = "Between points B and C, what is the water doing?"
choices = ["Staying liquid while its temperature rises", "Melting while its temperature stays the same", "Boiling while its temperature rises", "Freezing while its temperature falls"]
answer = "Staying liquid while its temperature rises"
explanation = '''
At B, all the ice has melted. At C, the water starts to boil.
In between, the line rises from 0 °C to 100 °C, and the water is all liquid.
So the water is **staying liquid while its temperature rises**.
'''
common_mistake = "Picking \"boiling while its temperature rises\". The passage says boiling starts only at C."

# ── Stand-alone ───────────────────────────────────────────────────────

[[question]]
id = "s-displays-0011"
skill = "s-displays"
principle = "SP.6.a"
topic = "L.d.1"
difficulty = 1
type = "multiple_choice"
status = "draft"
sources = ["OpenStax Introductory Statistics 2e 2.1 Stem-and-Leaf Graphs, Line Graphs, and Bar Graphs: https://openstax.org/books/introductory-statistics-2e/pages/2-1-stem-and-leaf-graphs-stemplots-line-graphs-and-bar-graphs", "Math is Fun: Line Graphs: https://www.mathsisfun.com/data/line-graphs.html", "Math is Fun: Pie Chart: https://www.mathsisfun.com/data/pie-charts.html", "NCES Kids' Zone, How Do I Choose Which Type of Graph to Use?: https://nces.ed.gov/nceskids/help/user_guide/graph/whentouse.asp"]
prompt = "A student measures the height of a bean plant every day for two weeks. Which kind of graph would best show how the plant grew over time?"
choices = ["A line graph", "A single bar showing the plant's height on the last day", "A pie chart", "A Venn diagram"]
answer = "A line graph"
explanation = '''
The data show one thing changing over time.
A line graph is made for showing change over time.
So the best choice is **a line graph**.
'''
common_mistake = "Picking a pie chart. A pie chart shows parts of a whole, not change over time."

[[question]]
id = "s-displays-0012"
skill = "s-displays"
principle = "SP.6.a"
topic = "L.c.1"
difficulty = 1
type = "multiple_choice"
status = "draft"
sources = ["OpenStax Introductory Statistics 2e 2.1 Stem-and-Leaf Graphs, Line Graphs, and Bar Graphs: https://openstax.org/books/introductory-statistics-2e/pages/2-1-stem-and-leaf-graphs-stemplots-line-graphs-and-bar-graphs", "Math is Fun: Bar Graphs: https://www.mathsisfun.com/data/bar-graphs.html", "NCES Kids' Zone, How Do I Choose Which Type of Graph to Use?: https://nces.ed.gov/nceskids/help/user_guide/graph/whentouse.asp"]
prompt = "A scientist counts how many birds of four different kinds visit a feeder in one day. Which kind of graph would best compare the four kinds?"
choices = ["A bar graph with one bar for each kind of bird", "A single bar showing the total number of birds", "A line graph of the total number of birds each hour", "A Venn diagram"]
answer = "A bar graph with one bar for each kind of bird"
explanation = '''
The data compare amounts in separate groups: four kinds of birds.
A bar graph is made for comparing separate groups.
So the best choice is **a bar graph with one bar for each kind of bird**.
'''
common_mistake = "Picking a line graph of the total each hour. It shows change over time, but it never splits the birds by kind."

[[question]]
id = "s-displays-0013"
skill = "s-displays"
principle = "SP.6.a"
topic = "P.a.1"
difficulty = 2
type = "multiple_choice"
status = "draft"
sources = ["OpenStax Introductory Statistics 2e 2.1 Stem-and-Leaf Graphs, Line Graphs, and Bar Graphs: https://openstax.org/books/introductory-statistics-2e/pages/2-1-stem-and-leaf-graphs-stemplots-line-graphs-and-bar-graphs", "Math is Fun: Data Graphs: https://www.mathsisfun.com/data/data-graph.html", "NCES Kids' Zone, Learning Line Graphs: https://nces.ed.gov/nceskids/help/user_guide/graph/line.asp", "NCES Kids' Zone, What are Independent and Dependent Variables?: https://nces.ed.gov/nceskids/help/user_guide/graph/variables.asp"]
prompt = "A student heats a beaker of water and records its temperature every minute. She wants to graph the results. Which should go on the x-axis, along the bottom?"
choices = ["Time, in minutes", "Temperature, in °C", "The starting temperature of the water", "The size of the beaker"]
answer = "Time, in minutes"
explanation = '''
The x-axis usually shows what was chosen or changed on purpose, like when to measure.
The student chose the times; the temperature is what she measured.
So **time, in minutes** goes on the x-axis.
'''
common_mistake = "Putting temperature on the x-axis. What you measure goes on the y-axis, up the side."

[[question]]
id = "s-displays-0014"
skill = "s-displays"
principle = "SP.6.a"
topic = "L.c.1"
difficulty = 2
type = "sort"
status = "reviewed"
sources = ["OpenStax Introductory Statistics 2e 2.1 Stem-and-Leaf Graphs, Line Graphs, and Bar Graphs: https://openstax.org/books/introductory-statistics-2e/pages/2-1-stem-and-leaf-graphs-stemplots-line-graphs-and-bar-graphs", "Math is Fun: Bar Graphs: https://www.mathsisfun.com/data/bar-graphs.html", "Math is Fun: Line Graphs: https://www.mathsisfun.com/data/line-graphs.html"]
prompt = "Sort each set of data by the kind of graph that would show it best."
groups = [
  { name = "Line graph", items = ["The temperature of a lake each month for a year", "A child's height on each birthday"] },
  { name = "Bar graph", items = ["The number of each kind of tree in a park", "The rainfall in four different cities last year"] },
]
explanation = '''
A line graph shows one thing changing over time: the lake's temperature by month, and the child's height by birthday.
A bar graph compares separate groups: kinds of trees, and four cities.
So the lake and the child go with the **line graph**, and the trees and cities go with the **bar graph**.
'''
common_mistake = "Putting the four cities on a line graph. The cities are separate groups with no order between them."

[[question]]
id = "s-displays-0015"
skill = "s-displays"
principle = "SP.6.b"
topic = "P.c.1"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
sources = ["OpenStax Chemistry 2e 2.4 Chemical Formulas: https://openstax.org/books/chemistry-2e/pages/2-4-chemical-formulas"]
prompt = "A molecule of carbon dioxide has one carbon atom (C) and two oxygen atoms (O). Which formula shows this molecule?"
choices = ["CO₂", "C₂O", "2CO", "CO"]
answer = "CO₂"
explanation = '''
In a formula, a small number after a symbol tells how many of that atom there are. No number means one.
There is one carbon, so C has no number. There are two oxygens, so O gets a 2.
So the formula is **CO₂**.
'''
common_mistake = "Picking C₂O, which puts the 2 on the wrong atom: it would mean two carbons and one oxygen."

[[question]]
id = "s-displays-0016"
skill = "s-displays"
principle = "SP.6.b"
topic = "P.c.1"
difficulty = 2
type = "fill_in"
status = "draft"
sources = ["OpenStax Chemistry 2e 2.4 Chemical Formulas: https://openstax.org/books/chemistry-2e/pages/2-4-chemical-formulas"]
prompt = "Methane is written CH₄. How many atoms in all are in one molecule of methane?"
answer = "5"
check = "1 + 4"
explanation = '''
A small number after a symbol counts the atom just before it. No number means one.
C has no number, so there is 1 carbon atom. H has a 4, so there are 4 hydrogen atoms.
Add them: 1 + 4 = 5.
So one molecule of methane has **5** atoms.
'''
common_mistake = "Answering 4 by counting only the hydrogens. The C with no number still counts as one carbon atom."
