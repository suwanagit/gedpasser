answer = "20930"
check = "0.5 * 4186 * 10"
explanation = '''
Use the formula Q = mcΔT.
Q = 0.5 kg × 4,186 J/(kg·°C) × 10 °C.
0.5 × 4,186 = 2,093, and 2,093 × 10 = 20,930.
So **20,930** joules are needed.
'''
common_mistake = "Leaving out the mass and answering 41,860. Every factor in the formula has to be multiplied."

