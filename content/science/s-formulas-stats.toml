# ── A week of rain (science-rainfall) ─────────────────────────────────

[[question]]
id = "s-formulas-stats-0001"
skill = "s-formulas-stats"
principle = "SP.8.a"
topic = "ES.b.1"
difficulty = 1
type = "fill_in"
status = "reviewed"
stimulus = "science-rainfall"
sources = ["Original passage science-rainfall", "OpenStax Introductory Statistics 2e 2.5 Measures of the Center of the Data: https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data", "Math is Fun: Finding a Central Value (Mean, Median, Mode): https://www.mathsisfun.com/data/central-measures.html"]
prompt = "What is the mode of the daily rainfall, in millimeters?"
answer = "14"
check = "14"
explanation = '''
The mode is the value that appears most often.
14 mm appears twice (Monday and Thursday); every other value appears once.
So the mode is **14** mm.
'''
common_mistake = "Answering 20, the largest value. The mode is the most common value, not the biggest."

[[question]]
id = "s-formulas-stats-0002"
skill = "s-formulas-stats"
principle = "SP.8.a"
topic = "ES.b.1"
difficulty = 2
type = "fill_in"
status = "reviewed"
stimulus = "science-rainfall"
sources = ["Original passage science-rainfall", "OpenStax Introductory Statistics 2e 2.5 Measures of the Center of the Data: https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data", "OpenStax Prealgebra 2e 5.5 Averages and Probability: https://openstax.org/books/prealgebra-2e/pages/5-5-averages-and-probability"]
prompt = "What is the mean daily rainfall for the week, in millimeters?"
answer = "9"
check = "(14 + 0 + 6 + 14 + 20 + 4 + 5) / 7"
explanation = '''
The mean is the total divided by the number of days.
Total: 14 + 0 + 6 + 14 + 20 + 4 + 5 = 63 mm, over 7 days.
63 ÷ 7 = 9.
So the mean is **9** mm.
'''
common_mistake = "Dividing by 6 because Tuesday had no rain. A day with 0 mm still counts as one of the 7 days."

[[question]]
id = "s-formulas-stats-0003"
skill = "s-formulas-stats"
principle = "SP.8.a"
topic = "ES.b.1"
difficulty = 2
type = "fill_in"
status = "reviewed"
stimulus = "science-rainfall"
sources = ["Original passage science-rainfall", "OpenStax Introductory Statistics 2e 2.5 Measures of the Center of the Data: https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data", "Math is Fun: Finding a Central Value (Mean, Median, Mode): https://www.mathsisfun.com/data/central-measures.html"]
prompt = "What is the median daily rainfall for the week, in millimeters?"
answer = "6"
check = "6"
explanation = '''
The median is the middle value once the values are in order.
In order: 0, 4, 5, 6, 14, 14, 20. With 7 values, the middle is the 4th.
So the median is **6** mm.
'''
common_mistake = "Taking the middle of the table as listed (Thursday, 14 mm) without putting the values in order first."

[[question]]
id = "s-formulas-stats-0004"
skill = "s-formulas-stats"
principle = "SP.8.a"
topic = "ES.b.1"
difficulty = 3
type = "multiple_choice"
status = "draft"
stimulus = "science-rainfall"
sources = ["Original passage science-rainfall", "OpenStax Introductory Statistics 2e 2.5 Measures of the Center of the Data: https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
prompt = "The mean rainfall for the week is 9 mm, but the median is only 6 mm. Which statement best explains why the mean is higher?"
choices = ["A few very wet days raise the mean but barely change the median", "Most days had more than 9 mm of rain", "The mean leaves out the day with no rain", "The median is always lower than the mean"]
answer = "A few very wet days raise the mean but barely change the median"
explanation = '''
The mean adds every value, so the wet days of 14, 14 and 20 mm raise it.
The median is the middle value, 6, and it would stay 6 even if the wettest day had twice as much rain.
So the mean is higher because **a few very wet days raise the mean but barely change the median**.
'''
common_mistake = "Picking \"most days had more than 9 mm\". Only 3 of the 7 days did; the other 4 had 6 mm or less."

[[question]]
id = "s-formulas-stats-0005"
skill = "s-formulas-stats"
principle = "SP.8.a"
topic = "ES.b.1"
difficulty = 1
type = "fill_in"
status = "reviewed"
stimulus = "science-rainfall"
sources = ["Original passage science-rainfall", "Math is Fun: Range: https://www.mathsisfun.com/data/range.html"]
prompt = "What is the range of the daily rainfall, in millimeters?"
answer = "20"
check = "20 - 0"
explanation = '''
The range is the largest value minus the smallest.
Largest: 20 mm (Friday). Smallest: 0 mm (Tuesday). 20 − 0 = 20.
So the range is **20** mm.
'''
common_mistake = "Answering 16 by subtracting the smallest rainy day, 4 mm. A day with 0 mm is still the smallest value."

# ── Stand-alone: statistics ───────────────────────────────────────────

[[question]]
id = "s-formulas-stats-0006"
skill = "s-formulas-stats"
principle = "SP.8.a"
topic = "P.c.4"
difficulty = 2
type = "fill_in"
status = "draft"
sources = ["OpenStax Introductory Statistics 2e 2.5 Measures of the Center of the Data: https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data", "OpenStax Prealgebra 2e 5.5 Averages and Probability: https://openstax.org/books/prealgebra-2e/pages/5-5-averages-and-probability"]
prompt = "A student measures the boiling point of a salt solution in four trials: 101.1 °C, 101.6 °C, 101.4 °C and 101.5 °C. What is the mean of the four trials, in °C?"
answer = "101.4"
check = "(101.1 + 101.6 + 101.4 + 101.5) / 4"
explanation = '''
The mean is the total divided by the number of trials.
Total: 101.1 + 101.6 + 101.4 + 101.5 = 405.6, over 4 trials.
405.6 ÷ 4 = 101.4.
So the mean is **101.4** °C.
'''
common_mistake = "Giving the median, 101.45, instead of the mean. The mean adds all four trials and divides by 4."

