prompt = "Average speed = distance ÷ time. A bus travels 150 km at an average speed of 50 km/h. How many hours does the trip take?"
answer = "3"
check = "150 / 50"
explanation = '''
The unknown is time, so rearrange the formula: time = distance ÷ speed.
150 km ÷ 50 km/h = 3 h.
So the trip takes **3** hours.
'''
common_mistake = "Multiplying 150 × 50. To find time, divide the distance by the speed."

