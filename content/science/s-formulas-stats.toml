sources = ["OpenStax College Physics 2e 2.3 Time, Velocity, and Speed: https://openstax.org/books/college-physics-2e/pages/2-3-time-velocity-and-speed"]
prompt = "Average speed = distance ÷ time. A canoe travels 30 km down a river in 6 hours. What is its average speed, in kilometers per hour?"
answer = "5"
check = "30 / 6"
explanation = '''
Use the formula: average speed = distance ÷ time.
Put in the numbers: 30 km ÷ 6 h = 5 km/h.
So the canoe's average speed is **5** km/h.
'''
common_mistake = "Multiplying 30 × 6 = 180. Speed is distance divided by time."

