prompt = "Force = mass × acceleration (F = ma). A 1,200 kg car speeds up with an acceleration of 2 m/s². What net force acts on the car, in newtons?"
answer = "2400"
check = "1200 * 2"
explanation = '''
Use the formula F = ma, with mass in kilograms and acceleration in m/s².
F = 1,200 kg × 2 m/s² = 2,400 N.
So the net force is **2,400** newtons.
'''
common_mistake = "Dividing 1,200 ÷ 2 = 600. The formula multiplies mass by acceleration."

