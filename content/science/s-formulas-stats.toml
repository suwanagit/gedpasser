answer = "3"
check = "60 / 20"
explanation = '''
Use the formula: density = mass ÷ volume.
60 g ÷ 20 cm³ = 3 g/cm³.
So the rock's density is **3** g/cm³.
'''
common_mistake = "Dividing 20 ÷ 60. Mass goes on top: density is mass divided by volume."

