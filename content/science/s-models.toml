# ── Distance and the length of a year (science-planets) ───────────────

[[question]]
id = "s-models-0001"
skill = "s-models"
principle = "SP.3.c"
topic = "ES.c.2"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
stimulus = "science-planets"
sources = ["Original passage science-planets", "NASA NSSDCA Planetary Fact Sheet: https://nssdc.gsfc.nasa.gov/planetary/factsheet/"]
prompt = "Saturn is farther from the Sun than Jupiter. Based on the table, how long is a year on Saturn most likely to be?"
choices = ["Longer than 4,331 Earth days", "Shorter than 365 Earth days", "Between 687 and 4,331 Earth days", "About the same as a year on Earth"]
answer = "Longer than 4,331 Earth days"
explanation = '''
In the table, the farther a planet is from the Sun, the longer its year.
Jupiter is the farthest planet listed, with a year of 4,331 days.
Saturn is farther from the Sun than Jupiter.
So a year on Saturn is most likely **longer than 4,331 Earth days**.
'''
common_mistake = "Picking \"between 687 and 4,331\". That range fits a planet between Mars and Jupiter, not one beyond Jupiter."

[[question]]
id = "s-models-0002"
skill = "s-models"
principle = "SP.3.c"
topic = "ES.c.2"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
stimulus = "science-planets"
sources = ["Original passage science-planets", "NASA NSSDCA Planetary Fact Sheet: https://nssdc.gsfc.nasa.gov/planetary/factsheet/"]
prompt = "An asteroid goes around the Sun at about 400 million km from the Sun. Based on the table, how long is its year most likely to be?"
choices = ["Between 687 and 4,331 Earth days", "Less than 88 Earth days", "Between 365 and 687 Earth days", "More than 4,331 Earth days"]
answer = "Between 687 and 4,331 Earth days"
explanation = '''
400 million km is farther than Mars (228.0) but closer than Jupiter (778.5).
In the table, a planet's year gets longer as its distance grows.
So the asteroid's year most likely falls between those two: **between 687 and 4,331 Earth days**.
'''
common_mistake = "Picking between 365 and 687 days. That range fits something between Earth and Mars, closer than 228 million km."

# ── Hares and lynx (science-hare-lynx) ────────────────────────────────

[[question]]
id = "s-models-0003"
skill = "s-models"
principle = "SP.7.a"
topic = "L.c.4"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
alaska = true
stimulus = "science-hare-lynx"
sources = ["Original passage science-hare-lynx", "OpenStax Concepts of Biology 19.4 Community Ecology: https://openstax.org/books/concepts-biology/pages/19-4-community-ecology", "National Park Service, Gates of the Arctic National Park and Preserve, Lynx: https://www.nps.gov/gaar/learn/nature/lynx.htm"]
prompt = "Use the predator and prey pattern in the passage. Why did the lynx population fall in years 5 and 6?"
choices = ["There were fewer hares for the lynx to eat", "There were too many hares in the forest", "The hares were hunting the lynx", "The lynx moved into a different forest"]
answer = "There were fewer hares for the lynx to eat"
explanation = '''
The passage says that when lynx are common, they eat so many hares that the hares fall.
Hares dropped from 80 thousand in year 3 to 25 thousand in year 5, then lynx dropped after.
So the lynx fell because **there were fewer hares for the lynx to eat**.
'''
common_mistake = "Picking \"the lynx moved\". Nothing in the passage says they left; the model says less food means fewer lynx."

[[question]]
id = "s-models-0004"
skill = "s-models"
principle = "SP.3.c"
topic = "L.c.4"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
alaska = true
stimulus = "science-hare-lynx"
sources = ["Original passage science-hare-lynx", "OpenStax Concepts of Biology 19.4 Community Ecology: https://openstax.org/books/concepts-biology/pages/19-4-community-ecology", "National Park Service, Gates of the Arctic National Park and Preserve, Lynx: https://www.nps.gov/gaar/learn/nature/lynx.htm"]
prompt = "Based on the pattern in the table, what will most likely happen to the lynx in the next few years after year 8?"
choices = ["They will increase, after the hares have increased", "They will keep falling every year", "They will stay at 300 forever", "They will increase before the hares do"]
answer = "They will increase, after the hares have increased"
explanation = '''
The hares are rising again: 10 thousand in year 6, 15 thousand in year 7, 35 thousand in year 8.
In the pattern, lynx rise a year or two after the hares rise, because they have more food.
So the lynx will most likely **increase, after the hares have increased**.
'''
common_mistake = "Picking \"they will keep falling\". The lynx stopped falling at 300 in years 7 and 8, and their food is coming back."

[[question]]
id = "s-models-0005"
skill = "s-models"
principle = "SP.7.a"
topic = "L.c.4"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
alaska = true
stimulus = "science-hare-lynx"
sources = ["Original passage science-hare-lynx", "OpenStax Concepts of Biology 19.4 Community Ecology: https://openstax.org/books/concepts-biology/pages/19-4-community-ecology", "National Park Service, Gates of the Arctic National Park and Preserve, Lynx: https://www.nps.gov/gaar/learn/nature/lynx.htm"]
prompt = "Suppose a disease kills most of the hares in this forest one year. Using the predator and prey model, what will most likely happen next?"
