# ── A cooling cup of tea (science-cooling) ────────────────────────────

[[question]]
id = "s-models-0006"
skill = "s-models"
principle = "SP.3.c"
topic = "P.a.1"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
stimulus = "science-cooling"
sources = ["Original passage science-cooling", "OpenStax College Physics 2e 14.1 Heat: https://openstax.org/books/college-physics-2e/pages/14-1-heat"]
prompt = "If the pattern continues, what will the tea temperature most likely be at 25 minutes?"
choices = ["About 34 °C", "About 45 °C", "About 20 °C", "About 39 °C"]
answer = "About 34 °C"
explanation = '''
The tea drops less each time: 20, then 14, then 10, then 7 degrees.
Each drop is about a third smaller than the one before, so the next drop is about 5 degrees.
Subtract it from the 20-minute reading: 39 − 5 = 34.
So at 25 minutes the tea will most likely be **about 34 °C**.
'''
common_mistake = "Picking about 20 °C, as if the tea jumps to room temperature. The drops are getting smaller, not bigger."

[[question]]
id = "s-models-0007"
skill = "s-models"
principle = "SP.3.c"
topic = "P.a.1"
difficulty = 2
type = "dropdown"
status = "reviewed"
stimulus = "science-cooling"
sources = ["Original passage science-cooling", "OpenStax College Physics 2e 14.1 Heat: https://openstax.org/books/college-physics-2e/pages/14-1-heat"]
prompt = "Complete the prediction: if the tea is left for many hours, it will most likely end up at about {{1}}, because heat keeps moving from {{2}} until both are at the same temperature."
blanks = [
  { choices = ["20 °C", "0 °C", "39 °C"], answer = "20 °C" },
  { choices = ["the warmer tea to the cooler room", "the cooler room to the warmer tea", "the mug to the tea"], answer = "the warmer tea to the cooler room" },
]
explanation = '''
Heat moves from warmer things to cooler things until they reach the same temperature.
The tea is warmer than the room, so heat leaves the tea until it matches the room.
So it ends up at about **20 °C**, because heat moves from **the warmer tea to the cooler room**.
'''
common_mistake = "Picking 0 °C, as if the tea keeps cooling forever. It stops cooling when it matches the room."

[[question]]
id = "s-models-0008"
skill = "s-models"
principle = "SP.7.a"
topic = "P.a.1"
difficulty = 3
type = "multiple_choice"
status = "reviewed"
stimulus = "science-cooling"
sources = ["Original passage science-cooling", "OpenStax College Physics 2e 14.1 Heat: https://openstax.org/books/college-physics-2e/pages/14-1-heat", "OpenStax College Physics 2e 14.5 Conduction: https://openstax.org/books/college-physics-2e/pages/14-5-conduction"]
prompt = "The student repeats the test with the same tea, starting at 90 °C, but in a room at 5 °C. How will the tea cool, compared with the first test?"
choices = ["Faster, because the gap between the tea and the room is bigger", "Slower, because cold air holds heat in", "At the same rate, because the tea is the same", "Faster at first, then it will stop at 20 °C"]
answer = "Faster, because the gap between the tea and the room is bigger"
explanation = '''
Heat flows from the tea to the room, and it flows faster across a bigger temperature difference.
At 5 °C, the room is much colder than before, so the difference is bigger.
So the tea will cool **faster, because the gap between the tea and the room is bigger**.
'''
common_mistake = "Picking \"stop at 20 °C\". The tea cools until it matches its own room, which is now 5 °C."

# ── Why we have seasons (science-seasons) ─────────────────────────────

[[question]]
id = "s-models-0009"
skill = "s-models"
principle = "SP.7.a"
topic = "ES.c.2"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
stimulus = "science-seasons"
sources = ["Original passage science-seasons", "OpenStax Astronomy 2e 4.2 The Seasons: https://openstax.org/books/astronomy-2e/pages/4-2-the-seasons"]
prompt = "Australia is in the southern half of Earth. Using the model in the passage, what season is it in Australia in June?"
choices = ["Winter", "Summer", "Spring", "It has no seasons"]
answer = "Winter"
explanation = '''
In June, the northern half leans toward the Sun and has summer.
The passage says the southern half leans away at the same time.
So in June it is **winter** in Australia.
'''
common_mistake = "Picking summer because June is summer in the United States. The two halves of Earth have opposite seasons."

[[question]]
id = "s-models-0010"
skill = "s-models"
principle = "SP.7.a"
topic = "ES.c.2"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
alaska = true
stimulus = "science-seasons"
sources = ["Original passage science-seasons", "OpenStax Astronomy 2e 4.2 The Seasons: https://openstax.org/books/astronomy-2e/pages/4-2-the-seasons", "National Snow and Ice Data Center, Arctic Weather and Climate: https://nsidc.org/learn/parts-cryosphere/arctic-weather-and-climate"]
prompt = "A town is at 70° north. Using the passage, what is most likely true there around late June?"
choices = ["The Sun does not set for at least one day", "The Sun does not rise for at least one day", "Day and night are each 12 hours long", "It is winter there"]
answer = "The Sun does not set for at least one day"
explanation = '''
The passage says every place north of the Arctic Circle, at about 66.5° north, has a day around June when the Sun never sets.
70° north is farther north than 66.5°.
So in late June, **the Sun does not set for at least one day** there.
'''
common_mistake = "Picking \"the Sun does not rise\". That happens near the North Pole in December, when the north leans away from the Sun."

[[question]]
id = "s-models-0011"
skill = "s-models"
principle = "SP.7.a"
topic = "ES.c.2"
difficulty = 3
type = "multiple_choice"
status = "reviewed"
stimulus = "science-seasons"
sources = ["Original passage science-seasons", "OpenStax Astronomy 2e 4.2 The Seasons: https://openstax.org/books/astronomy-2e/pages/4-2-the-seasons"]
prompt = "Suppose Earth's axis had no tilt at all. Using the model in the passage, what would most likely happen to the seasons?"
choices = ["They would mostly disappear, because each place would get about the same sunlight all year", "They would get stronger, because the Sun would be closer", "Both halves of Earth would have summer at the same time each year", "Nothing would change, because seasons are caused by distance from the Sun"]
answer = "They would mostly disappear, because each place would get about the same sunlight all year"
explanation = '''
In the model, seasons happen because the tilt makes each half lean toward the Sun, then away.
With no tilt, neither half would lean toward or away from the Sun during the year.
So the seasons **would mostly disappear, because each place would get about the same sunlight all year**.
'''
common_mistake = "Picking \"seasons are caused by distance\". The passage explains seasons by tilt, not by distance from the Sun."

# ── Two boiling points (science-boiling) ──────────────────────────────

[[question]]
id = "s-models-0012"
skill = "s-models"
principle = "SP.3.c"
topic = "P.c.2"
difficulty = 3
type = "multiple_choice"
status = "reviewed"
stimulus = "science-boiling"
sources = ["Original passage science-boiling", "OpenStax Chemistry 2e 10.3 Phase Transitions: https://openstax.org/books/chemistry-2e/pages/10-3-phase-transitions"]
prompt = "A third student heats pure water at a place about 1,500 meters above sea level. Based on the passage, which result is most likely?"
choices = ["It boils at a temperature between 90 °C and 100 °C", "It boils at exactly 100 °C", "It boils at a temperature below 90 °C", "It boils at a temperature above 100 °C"]
answer = "It boils at a temperature between 90 °C and 100 °C"
explanation = '''
Higher places have lower air pressure, and lower air pressure means a lower boiling point.
1,500 meters is between sea level (100 °C) and about 3,100 meters (about 90 °C).
So the water most likely **boils at a temperature between 90 °C and 100 °C**.
'''
common_mistake = "Picking below 90 °C. That would fit a place higher than the mountain camp, not lower."

# ── Stand-alone ───────────────────────────────────────────────────────

[[question]]
id = "s-models-0013"
skill = "s-models"
principle = "SP.7.a"
topic = "P.b.2"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
sources = ["OpenStax College Physics 2e 4.4 Newton's Third Law of Motion: https://openstax.org/books/college-physics-2e/pages/4-4-newtons-third-law-of-motion-symmetry-in-forces"]
prompt = "Newton's third law says that when one object pushes on another, the second pushes back just as hard in the opposite direction. A swimmer pushes backward on the wall of a pool and glides forward. What pushes the swimmer forward?"
choices = ["The wall pushes forward on the swimmer", "The swimmer pushes forward on the wall", "The water pulls the swimmer forward", "Nothing pushes the swimmer; the swimmer just moves"]
answer = "The wall pushes forward on the swimmer"
explanation = '''
The swimmer pushes backward on the wall.
By the third law, the wall pushes back on the swimmer just as hard, in the opposite direction: forward.
So **the wall pushes forward on the swimmer**.
'''
common_mistake = "Picking \"the swimmer pushes forward on the wall\". The swimmer pushes backward; the forward push comes from the wall."

[[question]]
id = "s-models-0014"
skill = "s-models"
principle = "SP.7.a"
topic = "P.b.2"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
sources = ["OpenStax College Physics 2e 4.4 Newton's Third Law of Motion: https://openstax.org/books/college-physics-2e/pages/4-4-newtons-third-law-of-motion-symmetry-in-forces"]
prompt = "Newton's third law says that when one object pushes on another, the second pushes back just as hard in the opposite direction. A person in a canoe pushes water backward with a paddle. Why does the canoe move forward?"
choices = ["The water pushes forward on the paddle", "The paddle pulls the canoe forward through the air", "The water in front of the canoe moves out of the way", "The person leans forward in the canoe"]
answer = "The water pushes forward on the paddle"
explanation = '''
The paddle pushes the water backward.
By the third law, the water pushes the paddle forward just as hard, and the paddle is held by the person in the canoe.
So the canoe moves forward because **the water pushes forward on the paddle**.
'''
common_mistake = "Picking \"the person leans forward\". Leaning moves weight around inside the canoe; it does not push the canoe through the water."

[[question]]
id = "s-models-0015"
skill = "s-models"
principle = "SP.7.a"
topic = "L.b.1"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
sources = ["OpenStax Concepts of Biology 5.1 Overview of Photosynthesis: https://openstax.org/books/concepts-biology/pages/5-1-overview-of-photosynthesis"]
prompt = "A healthy green plant is sealed in a clear glass jar and left in bright sunlight. Using what you know about photosynthesis, what will most likely happen to the amount of carbon dioxide in the jar over the next few hours?"
choices = ["It will go down, because the plant uses it to make sugar", "It will go up, because the plant gives off carbon dioxide in sunlight", "It will stay the same, because plants only use water", "It will go down, because sunlight destroys carbon dioxide"]
answer = "It will go down, because the plant uses it to make sugar"
explanation = '''
In photosynthesis, a plant uses carbon dioxide and water, with energy from sunlight, to make sugar and oxygen.
In bright light, the plant takes carbon dioxide out of the air in the jar.
So the carbon dioxide **will go down, because the plant uses it to make sugar**.
'''
common_mistake = "Picking \"it will go up\". In bright light, photosynthesis uses up carbon dioxide; the plant gives off oxygen."

[[question]]
id = "s-models-0016"
skill = "s-models"
principle = "SP.7.a"
topic = "L.c.5"
difficulty = 3
type = "order"
status = "reviewed"
sources = ["OpenStax Concepts of Biology 19.4 Community Ecology: https://openstax.org/books/concepts-biology/pages/19-4-community-ecology", "OpenStax Concepts of Biology 20.1 Energy Flow through Ecosystems: https://openstax.org/books/concepts-biology/pages/20-1-energy-flow-through-ecosystems"]
prompt = "In a pond, minnows eat algae and bass eat minnows. Suppose all the bass are removed. Put the most likely events in order."
items = [
  "The bass are removed from the pond",
  "Fewer minnows are eaten, so the minnow population grows",
  "The larger number of minnows eats more algae",
  "The amount of algae goes down",
]
explanation = '''
Bass eat minnows, so removing the bass first means fewer minnows get eaten.
With more minnows, more algae get eaten.
So the order is: **bass removed, minnows grow, minnows eat more algae, algae go down**.
'''
common_mistake = "Putting \"algae go down\" before \"minnows grow\". The algae drop because there are more minnows eating them, so the minnows have to grow first."
