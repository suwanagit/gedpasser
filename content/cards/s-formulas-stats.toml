# Quick review cards for s-formulas-stats (SP.7.b, SP.8.a). See WRITING.md.

[[card]]
id = "SP.7.b"
status = "draft"
title = "Using a formula"
key = "Write the formula, swap each letter for its number, then solve."
steps = [
  'Write the formula you were given.',
  'Put each number in place of its letter, with units.',
  'Solve. If the unknown is not alone, undo steps.',
]
example = '''
Pressure = force ÷ area. Force 60 N, area 3 m².
**Pressure:** 60 ÷ 3 = 20 N/m².
'''
hack = 'Units are clues: N ÷ m² gives N/m².'

[[card]]
id = "SP.8.a"
status = "draft"
title = "Mean, median, mode, range"
key = "Mean: add and divide. Median: middle. Mode: most often. Range: biggest minus smallest."
steps = [
  'Put the values in order first.',
  'Find the middle (median) and the most common (mode).',
  'Mean: sum ÷ count. Range: largest − smallest.',
]
example = '''
Data: 2, 3, 3, 8.
**Mean** 4, **median** 3, **mode** 3, **range** 6.
'''
hack = 'MEDian is in the MIDdle, like the median of a road.'
