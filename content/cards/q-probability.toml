# Cards for q-probability (Q.8.a–b). See WRITING.md.

[[card]]
id = "Q.8.a"
status = "reviewed"
title = "Counting choices"
key = '$$\text{ways} = (\text{choices for 1st}) \times (\text{choices for 2nd}) \times \cdots$$'
steps = [
  'Count the choices for each slot, then multiply.',
  'No repeats? Each slot has one fewer choice.',
  'Order doesn’t matter? Divide by the ways to arrange the picks.',
]
example = '''
Pick 2 of 6 people:
$$\text{captain, then co-captain: } 6 \times 5 = 30 \qquad \text{a pair: } 30 \div 2 = 15$$
**30** ordered ways, **15** pairs
'''
hack = 'Order matters? Permutation (P for podium: gold ≠ silver). Order doesn’t matter? Combination (C for committee). “And” between choices → multiply.'

[[card]]
id = "Q.8.b"
status = "reviewed"
title = "Probability"
key = '$$P = \frac{\text{favorable outcomes}}{\text{total outcomes}}$$'
steps = [
  'Count what you want, then count everything.',
  'Both happen (AND): multiply.',
  'Either one, when they can’t both happen (OR): add.',
  'No replacement: bottom drops 1 each pick; top drops if you took a wanted one.',
]
example = '''
A spinner has 5 equal parts; 3 are blue. Blue on two spins?
$$\tfrac{3}{5} \times \tfrac{3}{5} = \tfrac{9}{25}$$
**$\tfrac{9}{25}$**
'''
hack = '“AND → multiply, OR (no overlap) → add.” Not happening: $1 - P$. Any answer above 1 is wrong.'
