# Cards for Linear equations and inequalities (a-linear-equations). Format: content/cards/WRITING.md

[[card]]
id = "A.2.a"
status = "reviewed"
title = "Solving linear equations"
key = '$$x + a = b \;\to\; x = b - a \qquad ax = b \;\to\; x = \frac{b}{a}$$'
steps = [
  'Simplify each side: distribute, then combine like terms',
  'Move $x$ terms to one side and numbers to the other',
  'Divide by the number in front of $x$',
]
example = '''
$$4(x - 2) = x + 7$$
$$4x - 8 = x + 7$$
$$3x = 15$$
**$x = 5$**
'''
hack = 'An equation is a balance: do the same to both sides. Undo in reverse PEMDAS order: $+$ and $-$ first, then $\times$ and $\div$.'

[[card]]
id = "A.2.b"
status = "reviewed"
title = "Equations from stories"
key = '$$\text{total} = \text{fee} + \text{rate} \times \text{number}$$'
steps = [
  'Let a letter stand for what the question asks',
  'Write the equation from the story',
  'Solve, then check the answer makes sense',
]
example = '''
A kayak tour costs \$35 plus \$20 per hour. The bill is \$135.
$$35 + 20h = 135$$
$$20h = 100$$
**5 hours**
'''
hack = 'Backsolve: plug the answer choices back into the story. The one that gives the right total wins: $35 + 20(5) = 135$ ✓'

[[card]]
id = "A.2.c"
status = "reviewed"
title = "Writing linear equations"
key = '$$y = \underbrace{m}_{\text{rate}}\,x + \underbrace{b}_{\text{start}}$$'
steps = [
  'Find the start amount, counted once. That is $b$.',
  'Find the rate “for each” one. Multiply it by the variable.',
  'Going down, like fuel being used? Subtract the rate.',
]
example = '''
A tank has 200 L and fills at 15 L per minute. Water $W$ after $t$ minutes:
$$W = 200 + 15t$$
**$W = 200 + 15t$**
'''
hack = 'Test with 0: at $t = 0$ you should get the start, $W = 200$. Each extra minute should add 15.'

[[card]]
id = "A.3.a"
status = "reviewed"
title = "Solving inequalities"
key = '$$-x > 4 \;\to\; x < -4$$'
steps = [
  'Solve it just like an equation',
  'Multiply or divide by a negative? Flip the sign: $<$ becomes $>$',
  'Adding or subtracting never flips it',
]
example = '''
$$5 - 2x \ge 13$$
$$-2x \ge 8$$
$$x \le -4 \quad (\div\, {-2}, \text{ flip})$$
**$x \le -4$**
'''
hack = 'Why flip? $2 < 5$, but $-2 > -5$: a negative reverses the order. Check with a number from your answer: $x = -5$ gives $15 \ge 13$ ✓'

[card.figure]
kind = "number_line"
min = -8
max = 2
