[[card]]
id = "A.3.b"
status = "reviewed"
title = "Inequalities on a number line"
key = '$$\le,\ \ge \;\to\; \bullet \qquad <,\ > \;\to\; \circ$$'
steps = [
  'Closed (filled) circle: the number is included',
  'Open circle: the number is not included',
  'Greater than: shade right. Less than: shade left.',
]
example = '''
$$x > -1$$
$-1$ is not included: **open circle at $-1$, shade right**
'''
hack = 'The line under $\le$ or $\ge$ is extra ink, so fill in the circle. With $x$ on the left, the sign points the way to shade: $x > -1$ points right.'

[card.figure]
kind = "number_line"
min = -5
max = 5
points = [{ x = -1, open = true, label = "−1" }]
ray = { from = -1, dir = "right", open = true }

[[card]]
id = "A.3.c"
status = "reviewed"
title = "Inequalities in stories"
key = '$$\text{at least} \to \ge \qquad \text{at most} \to \le$$'
steps = [
  'At least, no less than, minimum: $\ge$',
  'At most, no more than, maximum: $\le$',
  'Solve, then pick a whole number that fits the story',
]
example = '''
You have \$40. Parking is \$4, and each ride costs \$5.
$$4 + 5r \le 40$$
$$5r \le 36$$
$$r \le 7.2$$
**7 rides**
'''
hack = 'Round the way the story allows. “At most” rounds down: 8 rides costs too much. “At least” rounds up: if you need at least 7.2, take 8.'

[[card]]
id = "A.3.d"
status = "reviewed"
title = "Writing inequalities"
key = '$$\text{start} + \text{rate} \times \text{number} \;\;\le \text{ or } \ge\;\; \text{limit}$$'
steps = [
  'Write the total like an equation: start plus rate times the variable',
  'Choose the sign from the words',
]
example = '''
Lee has \$120 and saves \$30 a week. He needs at least \$500.
$$120 + 30w \ge 500$$
**$120 + 30w \ge 500$**
'''
hack = '“At most” is a ceiling: you can touch it but not go over ($\le$). “At least” is a floor: you stand on it or go higher ($\ge$).'
