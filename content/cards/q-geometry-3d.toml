# Cards for q-geometry-3d (Q.5.a–f). See WRITING.md.

[[card]]
id = "Q.5.a"
status = "reviewed"
title = "Boxes"
key = '$$V = lwh \qquad SA = 2lw + 2lh + 2wh$$'
steps = [
  'Volume: multiply length, width and height.',
  'Surface area: find the 3 different faces, add, then double.',
]
example = '''
Box 2 m by 3 m by 5 m:
$$V = 2 \times 3 \times 5 = 30 \qquad SA = 2(6 + 10 + 15) = 62$$
**30 m³** and **62 m²**
'''
hack = 'Volume fills it (water); surface area wraps it (gift paper). Every face has a twin, so double. 1 m³ = 1000 L.'

[[card]]
id = "Q.5.b"
status = "draft"
title = "Cylinders"
key = '$$V = \pi r^2 h$$'
steps = [
  'Find the circle area: $\pi r^2$.',
  'Multiply by the height.',
  'Surface area: $2\pi r^2 + 2\pi r h$ (two lids plus the label).',
]
example = '''
Radius 3 m, height 5 m:
$$V \approx 3.14 \times 3^2 \times 5 = 3.14 \times 9 \times 5 = 141.3$$
Volume: **141.3 m³**
'''
hack = 'A cylinder is a stack of coins: circle area × stack height. Square the radius; don’t double it.'

[[card]]
id = "Q.5.c"
status = "reviewed"
title = "Prisms"
key = '$$V = Bh \quad (B = \text{area of the end})$$'
steps = [
  'Find the area $B$ of the end shape.',
  'Multiply by the length $h$.',
  'Surface area: $2B + (\text{perimeter of end}) \times h$.',
]
example = '''
Triangle end with base 5 m and height 4 m; prism 6 m long:
$$B = \tfrac{1}{2} \times 5 \times 4 = 10 \qquad V = 10 \times 6 = 60$$
Volume: **60 m³**
'''
hack = 'A prism is a loaf of bread: area of one slice × length of the loaf. Every slice is the same.'

[card.figure]
kind = "shape"
polygons = [{ points = [{ x = 0, y = 0 }, { x = 5, y = 0 }, { x = 2, y = 4 }], side_labels = ["5 m", "", ""] }]
segments = [{ from = [2, 0], to = [2, 4], dashed = true, label = "4 m" }]

[[card]]
id = "Q.5.d"
status = "reviewed"
title = "Pyramids and cones"
key = '$$V = \tfrac{1}{3}Bh \qquad V_{\text{cone}} = \tfrac{1}{3}\pi r^2 h$$'
steps = [
  'Find the base area $B$.',
  'Multiply by the height, then divide by 3.',
  'Use the straight-up height, not the slant height.',
]
example = '''
Square base 6 m on a side, height 5 m:
$$V = \tfrac{1}{3} \times 36 \times 5 = 60$$
Volume: **60 m³**
'''
hack = '“⅓ for pointy shapes”: anything that comes to a point holds ⅓ of the box or can with the same base and height.'

[[card]]
id = "Q.5.e"
status = "reviewed"
title = "Spheres"
key = '$$V = \tfrac{4}{3}\pi r^3 \qquad SA = 4\pi r^2$$'
steps = [
  'Given the diameter? Halve it first.',
  'Volume: cube $r$. Surface area: square $r$.',
  'Multiply by the rest of the formula.',
]
example = '''
Radius 3 cm:
$$V \approx \tfrac{4}{3} \times 3.14 \times 27 = 113.04$$
Volume: **113.04 cm³**
'''
hack = 'Match the power to the units: volume is cm³, so $r^3$; area is cm², so $r^2$.'

[[card]]
id = "Q.5.f"
status = "reviewed"
title = "Combined solids"
key = '$$V = V_1 + V_2 - \text{hollow part}$$'
steps = [
  'Split the solid into shapes you know.',
  'Find each volume, then add. Subtract any hollow part.',
  'Surface area: skip faces where the pieces touch.',
]
example = '''
Cylinder (radius 1 m, height 3 m) with a cone on top (height 3 m):
$$3.14 \times 1^2 \times 3 = 9.42 \qquad 9.42 \div 3 = 3.14$$
$$9.42 + 3.14 = 12.56$$
Total: **12.56 m³**
'''
hack = 'Two half-spheres make one whole sphere. A cone with the same base and height is ⅓ of the cylinder.'
