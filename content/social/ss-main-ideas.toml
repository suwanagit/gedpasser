answer = "Dividing power so that each part of the government can check the others"
explanation = '''
The author says the government must be made "to control itself".
Rulers are people, not angels, so controls on the government are needed.
Dividing power so that each part limits the others is such a control.
So the author would most likely support **dividing power so that each part of the government can check the others**.
'''
common_mistake = "Picking \"one leader with full power\". That removes the controls the author says a government needs."

[[question]]
id = "ss-main-ideas-0017"
