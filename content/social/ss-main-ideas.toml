sources = ["Passage social-federalist-51", "The Federalist No. 51 (1788), Avalon Project, Yale Law School: https://avalon.law.yale.edu/18th_century/fed51.asp", "National Constitution Center, James Madison, Federalist No. 51 (1788): https://constitutioncenter.org/the-constitution/historic-document-library/detail/james-madison-federalist-no-51-1788", "OpenStax American Government 3e 2.3 The Development of the Constitution: https://openstax.org/books/american-government-3e/pages/2-3-the-development-of-the-constitution"]
prompt = "Based on the passage, which plan would the author most likely support?"
