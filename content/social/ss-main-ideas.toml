explanation = '''
The idea is about the people who govern, not the people being governed.
This sentence says controls on government would not be needed if angels ruled.
People, not angels, run governments, so controls are needed.
So the best support is **"If angels were to govern men, neither external nor internal controls on government would be necessary"**.
'''
common_mistake = "Picking \"If men were angels, no government would be necessary\". That sentence is about why people need a government at all, not about limits on rulers."

# ── Stand-alone ─────────────────────────────────────────────────────

[[question]]
id = "ss-main-ideas-0018"
skill = "ss-main-ideas"
principle = "SSP.2.b"
topic = "CG.b.5"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
sources = ["OpenStax American Government 3e 2.3 The Development of the Constitution: https://openstax.org/books/american-government-3e/pages/2-3-the-development-of-the-constitution"]
prompt = "Congress passes a bill, and the President signs it into law. Later, a federal court rules that the law goes against the Constitution, so it can no longer be enforced. Which statement best describes how these events connect?"
choices = ["Each branch of government had a part in deciding the law's fate", "The President alone decided whether the law would stand", "The court wrote the law and then changed it", "Congress overruled the court to keep the law in place"]
answer = "Each branch of government had a part in deciding the law's fate"
explanation = '''
Congress (the legislative branch) passed the bill.
The President (the executive branch) signed it.
A court (the judicial branch) then ruled on it.
So **each branch of government had a part in deciding the law's fate**.
'''
common_mistake = "Picking \"the President alone\". The President signed the law, but Congress wrote it and a court later struck it down."

[[question]]
id = "ss-main-ideas-0019"
skill = "ss-main-ideas"
principle = "SSP.2.b"
topic = "USH.c.3"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
sources = ["National Archives, 13th Amendment to the U.S. Constitution: https://www.archives.gov/milestone-documents/13th-amendment", "National Archives, Bill of Rights (1791): https://www.archives.gov/milestone-documents/bill-of-rights", "National Archives, 14th Amendment to the U.S. Constitution: https://www.archives.gov/milestone-documents/14th-amendment", "National Archives, 15th Amendment to the U.S. Constitution: https://www.archives.gov/milestone-documents/15th-amendment"]
prompt = "The 13th Amendment (1865) ended slavery in the United States. The 14th Amendment (1868) made people born in the United States citizens and promised all persons the equal protection of the laws. The 15th Amendment (1870) said the right to vote could not be denied because of race. How are these three amendments connected?"
choices = ["All three came at the end of the Civil War or soon after, to extend freedom and rights to formerly enslaved people", "All three were part of the original Bill of Rights", "All three gave women the right to vote", "All three were passed before the Civil War to prevent it"]
answer = "All three came at the end of the Civil War or soon after, to extend freedom and rights to formerly enslaved people"
explanation = '''
The 13th Amendment was passed at the end of the Civil War and ratified in 1865; the 14th and 15th followed in 1868 and 1870.
Together they ended slavery, made formerly enslaved people citizens with equal protection, and protected their right to vote.
So **all three came at the end of the Civil War or soon after, to extend freedom and rights to formerly enslaved people**.
'''
common_mistake = "Picking the Bill of Rights. Those are the first ten amendments, added in 1791."
