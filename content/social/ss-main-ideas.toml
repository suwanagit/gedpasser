status = "reviewed"
stimulus = "social-federalist-51"
sources = ["Passage social-federalist-51", "The Federalist No. 51 (1788), Avalon Project, Yale Law School: https://avalon.law.yale.edu/18th_century/fed51.asp", "National Constitution Center, James Madison, Federalist No. 51 (1788): https://constitutioncenter.org/the-constitution/historic-document-library/detail/james-madison-federalist-no-51-1788", "Library of Congress, Full Text of The Federalist Papers: https://guides.loc.gov/federalist-papers/full-text", "OpenStax American Government 3e 2.3 The Development of the Constitution: https://openstax.org/books/american-government-3e/pages/2-3-the-development-of-the-constitution"]
prompt = "Which statement best expresses the central idea of the passage?"
choices = ["A government needs power over the people and also limits on its own power", "No government is needed if leaders are chosen carefully", "The people should be controlled strictly so the government stays safe", "Only the wisest people should be allowed to govern"]
answer = "A government needs power over the people and also limits on its own power"
explanation = '''
The last sentence names "the great difficulty".
First, the government must be able "to control the governed".
Next, it must be obliged "to control itself".
So the central idea is that **a government needs power over the people and also limits on its own power**.
'''
common_mistake = "Picking \"no government is needed\". The passage says that would be true only \"if men were angels\", and they are not."

[[question]]
id = "ss-main-ideas-0016"
