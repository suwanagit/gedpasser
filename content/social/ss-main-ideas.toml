prompt = "What is the passage mainly about?"
choices = ["A town choosing between two useful projects with limited money", "Why fishing boats move from one town to another", "How patients travel to a hospital by plane", "How a town raises taxes to pay for new projects"]
answer = "A town choosing between two useful projects with limited money"
explanation = '''
The passage begins with \$2 million and a choice of "one of two projects".
It gives the reasons for each project, then says the other must wait.
So it is mainly about **a town choosing between two useful projects with limited money**.
'''
common_mistake = "Picking a detail, like boats or patients, that supports only one side."

[[question]]
id = "ss-main-ideas-0013"
skill = "ss-main-ideas"
