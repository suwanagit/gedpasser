# ── The Preamble (social-preamble) ───────────────────────────────────

[[question]]
id = "ss-main-ideas-0001"
skill = "ss-main-ideas"
principle = "SSP.2.a"
topic = "CG.b.2"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
stimulus = "social-preamble"
sources = ["Passage social-preamble", "National Archives, The Constitution of the United States: A Transcription: https://www.archives.gov/founding-docs/constitution-transcript", "OpenStax American Government 3e 2.3 The Development of the Constitution: https://openstax.org/books/american-government-3e/pages/2-3-the-development-of-the-constitution", "National Archives, The Bill of Rights: A Transcription: https://www.archives.gov/founding-docs/bill-of-rights-transcript"]
prompt = "Which statement best expresses the central idea of the Preamble?"
choices = ["The people of the United States create the Constitution to reach shared goals", "The states form a union that can overrule the people", "The Constitution lists the rights that every citizen has", "The President is given the power to defend the country"]
answer = "The people of the United States create the Constitution to reach shared goals"
explanation = '''
The Preamble names who acts: "We the People of the United States".
It lists goals such as justice, peace at home, defense, the general welfare and liberty.
It ends with the people "do ordain and establish this Constitution".
So the central idea is that **the people of the United States create the Constitution to reach shared goals**.
'''
common_mistake = "Picking the list of rights. Rights are listed in the Bill of Rights, the first ten amendments; the Preamble states goals."

[[question]]
id = "ss-main-ideas-0002"
skill = "ss-main-ideas"
principle = "SSP.1.b"
topic = "CG.b.2"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
stimulus = "social-preamble"
sources = ["Passage social-preamble", "National Archives, The Constitution of the United States: A Transcription: https://www.archives.gov/founding-docs/constitution-transcript", "OpenStax American Government 3e 2.3 The Development of the Constitution: https://openstax.org/books/american-government-3e/pages/2-3-the-development-of-the-constitution"]
prompt = "Which words from the Preamble best support the idea that the government's power comes from the people?"
choices = ["\"We the People of the United States ... do ordain and establish this Constitution\"", "\"provide for the common defence\"", "\"insure domestic Tranquility\"", "\"promote the general Welfare\""]
answer = "\"We the People of the United States ... do ordain and establish this Constitution\""
explanation = '''
The idea is about where the government's power comes from.
Only one choice says who creates the Constitution: the people, who "ordain and establish" it.
The other choices are goals of the government, not the source of its power.
So the best support is **"We the People of the United States ... do ordain and establish this Constitution"**.
'''
common_mistake = "Picking one of the goals. Goals say what the government should do, not who gave it power."

[[question]]
id = "ss-main-ideas-0003"
skill = "ss-main-ideas"
principle = "SSP.1.a"
topic = "CG.b.3"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
stimulus = "social-preamble"
sources = ["Passage social-preamble", "National Archives, The Constitution of the United States: A Transcription: https://www.archives.gov/founding-docs/constitution-transcript"]
prompt = "The Preamble says the Constitution will \"secure the Blessings of Liberty to ourselves and our Posterity.\" What does this suggest about the writers?"
choices = ["They wanted the Constitution to protect liberty for future generations as well as their own", "They expected the Constitution to last only until the war debts were paid", "They meant the Constitution to apply only to the people who signed it", "They planned to give later generations more rights than they had themselves"]
answer = "They wanted the Constitution to protect liberty for future generations as well as their own"
explanation = '''
"Ourselves" means the people living then.
"Posterity" means the people who come after them: their children and later generations.
So the writers wanted **the Constitution to protect liberty for future generations as well as their own**.
'''
common_mistake = "Picking \"only the people who signed it\". The word Posterity reaches past the people alive then."

# ── The Declaration of Independence (social-declaration) ──────────────

[[question]]
id = "ss-main-ideas-0004"
skill = "ss-main-ideas"
principle = "SSP.1.a"
topic = "CG.b.1"
difficulty = 1
type = "multiple_choice"
status = "reviewed"
stimulus = "social-declaration"
sources = ["Passage social-declaration", "National Archives, Declaration of Independence: A Transcription: https://www.archives.gov/founding-docs/declaration-transcript"]
prompt = "According to the passage, why are governments created?"
choices = ["To secure people's rights", "To decide which rights people have", "To collect taxes for defense", "To choose who is created equal"]
answer = "To secure people's rights"
explanation = '''
The passage says: "to secure these rights, Governments are instituted among Men".
"Instituted" means set up, and "these rights" are life, liberty and the pursuit of happiness.
So governments are created **to secure people's rights**.
'''
common_mistake = "Picking \"to decide which rights people have\". The passage says people are born with these rights; government only protects them."

[[question]]
id = "ss-main-ideas-0005"
skill = "ss-main-ideas"
principle = "SSP.1.a"
topic = "USH.a.1"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
stimulus = "social-declaration"
sources = ["Passage social-declaration", "National Archives, Declaration of Independence: A Transcription: https://www.archives.gov/founding-docs/declaration-transcript"]
prompt = "Based on the passage, what may the people do when a government destroys the rights it was meant to protect?"
choices = ["Change the government or replace it with a new one", "Ask the king to restore their rights", "Wait for the courts to decide whether the rights still exist", "Leave the country and start over somewhere else"]
answer = "Change the government or replace it with a new one"
explanation = '''
The passage says that when a government "becomes destructive of these ends", the people may "alter or to abolish it".
It adds that they may "institute new Government".
So the people may **change the government or replace it with a new one**.
'''
common_mistake = "Picking \"ask the king\". The colonists had already tried that; the passage claims the right to change the government itself."

[[question]]
id = "ss-main-ideas-0006"
skill = "ss-main-ideas"
principle = "SSP.1.b"
topic = "CG.b.2"
difficulty = 2
type = "multiple_choice"
status = "reviewed"
stimulus = "social-declaration"
sources = ["Passage social-declaration", "National Archives, Declaration of Independence: A Transcription: https://www.archives.gov/founding-docs/declaration-transcript", "OpenStax American Government 3e 1.1 What is Government?: https://openstax.org/books/american-government-3e/pages/1-1-what-is-government"]
prompt = "Which words from the passage best support the idea that a government's authority depends on the agreement of the people?"
choices = ["\"deriving their just powers from the consent of the governed\"", "\"all men are created equal\"", "\"endowed by their Creator with certain unalienable Rights\"", "\"laying its foundation on such principles\""]
answer = "\"deriving their just powers from the consent of the governed\""
explanation = '''
The idea is that a government's power rests on the people agreeing to it.
"Consent of the governed" means the agreement of the people being governed.
The other choices are about equality, where rights come from, or how a new government is built.
So the best support is **"deriving their just powers from the consent of the governed"**.
'''
common_mistake = "Picking \"endowed by their Creator\". That line says where rights come from, not where government power comes from."

[[question]]
id = "ss-main-ideas-0007"
skill = "ss-main-ideas"
principle = "SSP.2.a"
topic = "USH.a.1"
difficulty = 2
type = "dropdown"
status = "reviewed"
stimulus = "social-declaration"
sources = ["Passage social-declaration", "National Archives, Declaration of Independence: A Transcription: https://www.archives.gov/founding-docs/declaration-transcript"]
prompt = "Complete the central idea of the passage: people have {{1}} that no government gives them, and a government that {{2}} them may be changed."
blanks = [
  { choices = ["rights", "duties", "property"], answer = "rights" },
  { choices = ["destroys", "protects", "writes down"], answer = "destroys" },
]
explanation = '''
The passage says people are "endowed by their Creator" with rights, so the rights come before any government.
It says the people may change a government that "becomes destructive of these ends".
So: people have **rights** that no government gives them, and a government that **destroys** those rights may be changed.
'''
common_mistake = "Picking \"protects\". The passage says governments exist to protect rights; it is a government that destroys them that may be changed."

