note = "The key ('what it led to'), the drought example and the hack ('Draw arrows: event, then what it led to') all teach cause and effect, which is SSP.3.c in ss-cause-effect. SSP.2.b is about describing people, places, events and processes and how they connect, and this skill's own SSP.2.b items connect by shared goal (0019: three amendments with one purpose) or by each part playing a role (0018: three branches), not by one thing causing another. A learner drawing cause arrows on 0019 could pick a wrong 'X led to Y' reading. Fix: make the key cover all link types, e.g. 'Name the people or events, then the link: a cause, a step, or a shared goal.' Change the hack to something like 'Ask what they have in common or how one sets up the next.' Optionally use a non-causal example (two laws with the same aim) so the card does not duplicate the cause-effect card."
