note = '''
Key and menus are right. The explanation breaks EXPLANATION_STYLE: it checks only two of the three steps (leaves out 20 ÷ 200) and does not end with a full sentence restating the answer. Suggested explanation:
Divide each level by the one below it: 2,000 ÷ 20,000 = 0.1, 200 ÷ 2,000 = 0.1, and 20 ÷ 200 = 0.1.
0.1 is **one-tenth** each time.
The smallest number, 20, belongs to the snakes.
So each level holds about one-tenth of the energy of the level below it, and the **snakes** hold the least.
'''
