hash = "def8cd65c0cb16c5"
verdict = "fix"
note = "The worked example is weak and slightly confusing: daylight hours by month is time-series data best shown as a line graph, and a rise-then-fall pattern does not illustrate the positive/negative/no-trend rule just given for scatter plots. It also has no numbers, so it does not demonstrate reading a table or graph. Replace it with a concrete example, e.g. a table of hours and pay (2 h earns 30, 4 h earns 60) where the learner finds the rate 15 per hour and predicts 6 h, plus a one-line scatter-plot example with a clearly positive trend."
date = "2026-11-10"

