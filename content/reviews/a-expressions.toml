note = "Key correct: 6(2x - 3) = 12x - 18 for all x, and 6 is the GCF. The explanation's last sentence, 'The other correct-looking forms still have a common factor left inside the parentheses', is inaccurate for $6(2x - 18)$, which is not equal at all (it expands to 12x - 108). Rewrite: '$3(4x - 6)$ and $2(6x - 9)$ are equal to $12x - 18$ but not completely factored, since $4x - 6$ and $6x - 9$ still share a factor. $6(2x - 18)$ is wrong: it expands to $12x - 108$.' Also consider difficulty 2; single-step GCF factoring is not a hard item. Lesson A.1.a should also mention the greatest common factor (see that review)."
date = "2026-11-10"

