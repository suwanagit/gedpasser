  independent or dependent variable. Add OpenStax Psychology 2e 2.3 Analyzing Findings
  (https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings), which defines both,
  experimental and control groups, and confounding variables.
- SP.2.d (search "planning a science experiment"; principle includes choosing tools and units):
  Concepts of Biology 1.2 covers the steps of the scientific method but not tools or units. Suggest
  adding a measurement page such as OpenStax Chemistry 2e 1.4 Measurements (SI units).
SP.2.b and SP.2.c are fine as linked. Search words for all five make sense.
