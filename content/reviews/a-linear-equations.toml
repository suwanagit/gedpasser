[[review]]
id = "a-linear-equations-0003"
kind = "question"
hash = "e20d47ea5d0a3215"
verdict = "fix"
solved = "x >= -5 (boundary -5)"
note = "Math and key are correct (x >= -5), but the prompt gives away the very skill being tested: it tells the learner the answer has the form 'x >= ...', so the sign flip is done for them. A learner who forgets to flip gets x <= -5 and still types -5, which is graded correct, so the stated common_mistake can never be caught. Fix: make it multiple choice with the full inequality as choices (for example x >= -5, x <= -5, x >= 5, x <= 5), with x <= -5 as the forgot-to-flip distractor and +5 options for sign slips; or keep fill-in but ask 'What is the smallest integer that satisfies it?' (answer -5; an unflipped x <= -5 has no smallest integer, so the error shows). As written, difficulty 3 is also too high for what it actually requires."
date = "2026-11-10"

