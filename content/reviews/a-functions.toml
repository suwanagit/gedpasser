verdict = "fix"
note = "Re-review. The new worked example is correct: -5t(t - 8) = 0 gives t = 0 and 8, the vertex is at t = 4, h(4) = -80 + 160 = 80 m, and the increasing/decreasing intervals are right. It does not give 0004 or 0005 away: those use -5t^2 + 20t and -5t^2 + 30t, which have different answers (2 and 6). The example teaches the method, which is its job. One problem remains in the new table line. It says 'the intercepts are the rows where the output is 0', but those are only the x-intercepts. The bullet list above it defines intercepts as crossings of both axes, so this contradicts it. Change it to: 'the x-intercepts are the rows where the output is 0; the y-intercept is the output in the row where the input is 0.' Also qualify the maximum: the highest value may fall between two rows. For example, if two rows tie for the top value, the maximum of a parabola is halfway between them. Say the turn shows roughly where the maximum is, not always its exact value."
date = "2026-11-10"

