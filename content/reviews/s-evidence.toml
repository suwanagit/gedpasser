note = '''Example data is incomplete: "3 of 4 plants in the sun grew taller" - taller than what? A conclusion about sun needs a comparison. Rewrite: "Data: 3 of 4 sunny plants grew taller than the shady ones." / "**Supported:** most sunny plants outgrew the shady ones. Not: "sun always makes plants taller"." Also the hack "The safest true answer usually wins" can push learners toward hedged "neither" or "stayed about the same" choices (wrong in 0001, 0003, 0005). Suggest: "Pick the answer that fits every number and claims no more."'''
