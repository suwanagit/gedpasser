[[review]]
id = "science-food-chain"
kind = "stimulus"
hash = "782e618f0b8344b8"
reviewer = "factcheck-b"
role = "factcheck"
verdict = "fix"
note = '''
Source line is fine (Original, made-up numbers labelled). Trophic level, producer and consumer definitions match CoB 20.1. Problem: the passage says the made-up numbers "show a pattern scientists see in real food chains", and the table's pattern is an exact one-tenth drop at every level (which Q12 and Q15 build on). CoB 20.1 only supports "each trophic level has less energy available" (Figure 20.5); it gives no size for the drop. Fix one of two ways: (a) add OpenStax Biology 2e 46.2 Energy Flow through Ecosystems (https://openstax.org/books/biology-2e/pages/46-2-energy-flow-through-ecosystems), which defines trophic level transfer efficiency, calls it low, and gives about 14.5 percent for Silver Springs, and say "roughly one-tenth" is a typical rule of thumb; or (b) narrow the sentence to "they show the pattern scientists see in real food chains: each level holds much less energy than the one below it."
'''
date = "2026-11-12"

[[review]]
id = "science-water-cycle"
kind = "stimulus"
hash = "fe1c6aad9af7d6da"
reviewer = "factcheck-b"
role = "factcheck"
verdict = "fix"
note = '''
Source line is fine (Original). CoB 20.2 supports: Sun drives the cycle by warming oceans and surface water; evaporation is water to water vapor; vapor condenses into clouds of droplets; precipitation as rain or snow; surface runoff; percolation into groundwater; 97.5% salt / 2.5% fresh; 99% of fresh water locked as ice or underground; less than 1% of fresh water in lakes and rivers (table matches exactly). One claim is not in the cited source: "When the droplets grow heavy enough, they fall as precipitation." CoB 20.2 only says the vapor condenses into clouds "and eventually leads to precipitation". Either reword to "Eventually the droplets fall as precipitation: rain or snow." or add a source that states the droplet-growth mechanism (e.g. a NOAA or NASA water-cycle page). Overlap check: only the short phrase "less than 1 percent of fresh water" matches the source, which is a fact statement and fine.
'''
date = "2026-11-12"

