[[review]]
id = "social-alaska-statehood"
kind = "stimulus"
hash = "10c7cc42bff38808"
reviewer = "factcheck-ssa"
role = "factcheck"
verdict = "fix"
note = "Confirmed: 1867 purchase from Russia (history.state.gov/milestones/1866-1898/alaska-purchase, which also gives Jan 3, 1959 statehood). UAF 'A place to write a new Alaska' (uaf.edu/centennial/uaf100/ideas/constitution.php): 55 elected delegates, University of Alaska in Fairbanks, first day Nov. 8, 1955; voters ratified in April 1956 (Lt. Governor page: April 24, 1956); Congress passed a terms bill in June 1958; voters endorsed it in August 1958; Eisenhower signed the proclamation Jan. 3, 1959, 49th state. NOT confirmed by any working cited source: (a) 1912 territory with its own elected legislature; (b) a delegate who could speak but not vote; (c) federal control of salmon fishing rules; (d) two senators and one representative. The cited US House History URL (history.house.gov/Historical-Highlights/1951-2000/Alaska-and-Hawaii-statehood/) returns an Error Document page (curl and WebFetch, 2026-11-13), so it confirms nothing. The source line also names histories without URLs. Fix: cite working pages, e.g. University of Alaska Creating Alaska 'Territory Differs from State' (alaska.edu/uajourney/history-and-trivia/alaska-history/creating-alaska/statehood-files/territory-differs-from-st/), which confirms the Organic Act of 1912 legislative powers, a Delegate who 'has no vote', and two senators per state; plus a source for federal control of fish (salmon, fish traps), e.g. Gruening's 1955 convention speech on the same site, and the Alaska Statehood Act (Pub. L. 85-508) for one representative. The 'could speak' part also needs a source."
date = "2026-11-13"

