[[review]]
id = "social-alaska-statehood"
kind = "stimulus"
hash = "0f911a6ba091917e"
reviewer = "factcheck-ssb"
role = "factcheck"
verdict = "fix"
note = 'One claim is not confirmed: "In 1912, Congress gave the Territory of Alaska its own ELECTED legislature." UA "Territory Differs from State" says only that "especially in the Organic Act of 1912, Congress has granted certain local and territorial legislative powers to the people of Alaska" and refers to a Territorial Legislature with two houses; it never says the legislature was elected (the only "elect" on the page is about California electing its governor). No other cited source (UAF, State Dept, Statehood Act) covers 1912. Fix: either drop "elected" ("its own legislature" is confirmed), or add a source that says it, e.g. the text of the Alaska Organic Act of 1912 (37 Stat. 512) or an Alaska Legislature/State history page, and list it in the source line and on the questions. Everything else confirmed: 1867 purchase (State Dept); Congress could overrule ("acts of Congress take precedence over and repeal acts of the Territorial Legislature", "Any law of the legislature may be rendered void by a specific action of Congress") and one delegate with no vote (UA); 55 elected delegates, 1955, University of Alaska in Fairbanks, April 1956 ratification, 1958 terms bill, August 1958 vote, Jan 3 1959 Eisenhower proclamation, 49th state (UAF; Lt. Gov page gives April 24, 1956); two Senators and one Representative with all rights and privileges of other states (Statehood Act Sec. 7, 8(c), 9). "Original" source label is appropriate.'
date = "2026-11-13"

