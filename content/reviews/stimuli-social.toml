note = "Quote matches the Avalon Project text (avalon.law.yale.edu/18th_century/fed51.asp) exactly. No. 51 dates from 1788 (Avalon: New York Packet, Feb. 8, 1788). The LOC guide (guides.loc.gov/federalist-papers/full-text) confirms the essays ran from Oct 1787 to May 1788 in New York papers to urge New Yorkers to ratify. Public domain (1788). Problem: 'usually credited to James Madison' is historically fair (Founders Online files No. 51 in the Madison Papers; the National Constitution Center titles it 'James Madison, Federalist No. 51 (1788)'), but both sources the No. 51 questions cite list the author as 'Hamilton or Madison', and the stimulus source line gives no URL. Fix: add a source that supports the Madison credit, e.g. constitutioncenter.org/the-constitution/historic-document-library/detail/james-madison-federalist-no-51-1788 or founders.archives.gov/documents/Madison/01-10-02-0279, and give a URL for the text (Avalon)."
date = "2026-11-13"

