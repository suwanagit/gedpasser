note = "Numbers and examples are correct, but two statements are oversimplified. (1) 'Probability = favorable / total outcomes' is only true when all outcomes are equally likely; add 'when every outcome is equally likely'. (2) 'Without replacement, the total goes down after each pick' omits that the favorable count can also drop (e.g. 4 red of 10, then 3 red of 9); say 'the total, and often the favorable count, go down after each pick' and ideally give that example."
