[[question]]
id = "s-demo-data-0002"
skill = "s-demo-data"
principle = "SP.8.a"
topic = "L.b.1"
difficulty = 2
type = "fill_in"
status = "draft"
stimulus = "science-plants"
prompt = "What is the mean height of the three plants, in centimeters?"
answer = "12"
check = "(10 + 12 + 14) / 3"
explanation = '''
Add the heights: $10 + 12 + 14 = 36$.
Divide by the number of plants, 3: $36 \div 3 = 12$.
So the mean height is **12 cm**.
'''
common_mistake = "Adding the heights but forgetting to divide by 3 (36)."

